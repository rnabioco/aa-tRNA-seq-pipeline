[workspace]
name = "aa-tRNA-seq-pipeline"
version = "0.2.1"
description = "Snakemake pipeline for analyzing Oxford Nanopore direct RNA sequencing of aminoacylated tRNAs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[dependencies]
# Core bioinformatics tools
samtools = "*"
bwa = "*"
bedtools = "*"
deeptools = "*"
pybigwig = "*"
# Python dependencies
python = ">=3.10"
pysam = "*"
pandas = "*"
pyarrow = "*"
gitpython = "*"
uv = "*"
parasail-python = "*"
# Snakemake and workflow
snakemake = ">=9.17"
snakefmt = "*"
snakemake-executor-plugin-lsf = "*"
snakemake-executor-plugin-slurm = ">=2.5"
snakemake-executor-plugin-cluster-generic = "*"
# ONT tools
libstdcxx-ng = ">=12"
ont-modkit = ">=0.6.1"
# Linting tools
# Pinned to a minor: ruff's formatter style is only guaranteed stable within
# one, and `lint-python` gates CI now, so an unpinned bump could turn a green
# main red on style alone. The lint RULE SET is pinned separately and
# explicitly in ruff.toml, for the same reason. Was "*", which had resolved to
# three different ruff versions across the environments in pixi.lock.
ruff = "0.16.*"
yamllint = "*"
nvitop = ">=1.6.2,<2"
rich-click = ">=1.7.0"
# WarpDemuX dependencies (compiled packages best from conda)
dtaidistance = "*"
scikit-learn = "*"
scipy = "*"
cython = "*"
catboost = "*"
ruptures = "*"
bottleneck = "*"

[activation]
scripts = ["scripts/setup-env.sh"]

[tasks]
setup = { cmd = "bash scripts/setup-tools.sh", description = "One-time setup: install dorado, models, escpod, and WarpDemuX" }
dl-test-data = { cmd = "cd .tests && bash dl_test_data.sh", description = "Download test data" }
# Pipeline execution
dry-run = { cmd = "snakemake -n --configfile=config/config-test.yml", description = "Dry run with test config" }
test = { cmd = "snakemake --configfile=config/config-test.yml --cores 4", description = "Run pipeline locally with test data" }
test-lsf = { cmd = "snakemake --configfile=config/config-test.yml --profile=cluster/lsf", description = "Run test pipeline on LSF cluster" }
test-slurm = { cmd = "snakemake --configfile=config/config-test.yml --profile=cluster/slurm", description = "Run test pipeline on SLURM cluster" }
run-preprint = { cmd = "snakemake --configfile=config/config-preprint.yml --profile=cluster/generic --rerun-incomplete", description = "Run preprint pipeline on cluster" }
clean-test = { cmd = "snakemake clean --configfile=config/config-test.yml --cores 1", description = "Delete large regenerable intermediates for the test run (keeps summaries + final BAM)" }
# Development
fmt = { cmd = "snakefmt workflow/Snakefile workflow/rules/*.smk", description = "Format Snakemake files" }
dag = { cmd = "snakemake --configfile=config/config-test.yml --dag | dot -Tpng > workflow/workflow_dag.png", description = "Generate workflow DAG image" }
collapse-ref = { cmd = "python workflow/scripts/collapse_gtrndb_fasta.py", description = "Collapse redundant sequences in a GtRNAdb FASTA reference" }
# Linting
lint-snakefmt = { cmd = "snakefmt --check workflow/", description = "Check Snakemake formatting" }
lint-python = { cmd = "ruff check workflow/scripts/ && ruff format --check workflow/scripts/", description = "Lint and check Python formatting" }
lint-yaml = { cmd = "yamllint config/ .github/", description = "Lint YAML files (rules in .yamllint.yml)" }
# Leech tasks (amino-acid identity classification only; charging uses escpod)
# WarpDemuX tasks
install-warpdemux = { cmd = "bash -c '[ -d resources/tools/WarpDemuX ] || git clone --recursive https://github.com/KleistLab/WarpDemuX.git resources/tools/WarpDemuX' && uv pip install -e resources/tools/WarpDemuX", description = "Clone and install WarpDemuX" }
dry-run-demux = { cmd = "snakemake -n --configfile=config/config-demux-test.yml", description = "Dry run WDX demux DAG (this config cannot execute — see its header and issue #120)" }
# escapepod (LDX) demux tasks
# The LDX path is the one with a real barcoded fixture, so it is the only
# demux config that runs end to end. dry-run-ldx is cheap enough for CI;
# test-ldx needs a GPU for dorado.
dry-run-ldx = { cmd = "snakemake -n --configfile=config/config-ldx-test.yml", description = "Dry run the LDX demux test DAG" }
test-ldx = { cmd = "snakemake --configfile=config/config-ldx-test.yml --cores 8", description = "Run the LDX demux test end-to-end on the committed fixture (needs a GPU)" }
escpod-model-info = { cmd = "escpod demux --model resources/models/demux/barcode_crf_ldx16_rna004@v0.1.0 --info", description = "Describe the vendored LDX (ldx16) CRF demux bundle" }
# Verifies vendored demux bundles against the hashes UPSTREAM declares, not
# against any checksum file we could have written. Catches a locally patched
# bundle, which is what #107/#108 left behind for eleven days.
verify-demux-model = { cmd = "python scripts/verify-demux-model.py", description = "Verify vendored demux bundles are byte-for-byte upstream" }
# Charging classifier
verify-charging-model = { cmd = "bash -c 'cd resources/models/charging/charging_feature_nn_rna004@v0.1.0 && sha256sum -c SHA256SUMS.txt'", description = "Verify the vendored charging model bundle against its pinned checksums" }
# GPU demux runtime.
#
# NOT a conda dependency, deliberately. `ort 2.0.0-rc.13` (what escapepod-rs
# pins) enables `api-27`, so it refuses any onnxruntime older than 1.27.x with a
# BadVersion error at dlopen. conda-forge's newest CUDA build is 1.26.0, so
# there is no conda package that satisfies it — the library has to come from the
# onnxruntime GitHub release. The cuda13 variant matches the CUDA 13 on the gpu
# nodes and bundles its own CUDA deps.
#
# Only needed for `ldx.gpu: true`, which additionally needs the GPU build of
# escpod — downloaded by `pixi run setup` since escapepod-rs 0.17.1.
install-ort-gpu = { cmd = "bash scripts/install-ort-gpu.sh", description = "Download the CUDA onnxruntime that escpod --device gpu needs" }
install-escpod-gpu = { cmd = "bash scripts/install-escpod-gpu.sh", description = "Build escpod with GPU features from source (only for an unreleased ref; pixi run setup downloads the released one)" }

# Testing feature
[feature.test]
platforms = ["linux-64"]

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
parasail-python = "*"
pysam = "*"

[feature.test.tasks]
test-unit = { cmd = "pytest tests/unit/ -v --cov=workflow/scripts", description = "Run unit tests with coverage" }
test-integration = { cmd = "pytest tests/integration/ -v", description = "Run integration tests" }
test-all = { cmd = "pytest tests/ -v --cov=workflow/scripts", description = "Run all tests with coverage" }

# QC Report rendering feature
[feature.report]
platforms = ["linux-64"]

[feature.report.dependencies]
quarto = "*"
r-base = ">=4.3"
r-tidyverse = "*"
r-gt = "*"
r-paletteer = "*"
r-fs = "*"
r-patchwork = "*"
r-scales = "*"
r-sessioninfo = "*"
r-pak = "*"
r-cowplot = "*"
r-ggrepel = "*"
r-yaml = "*"
r-circlize = "*"
bioconductor-complexheatmap = ">=2.10"
r-pheatmap = "*"
# clover (rnabioco/clover) Imports -- installed from GitHub with pak, but its
# Bioconductor dependencies come from bioconda so the install does not depend on
# bioconductor.org being reachable.
bioconductor-biostrings = "*"
bioconductor-summarizedexperiment = "*"

[feature.report.tasks]
install-quartabs = { cmd = "R -e \"pak::pak('sayuks/quartabs')\"", description = "Install quartabs from GitHub" }
render-qc = { cmd = "snakemake render_all_qc_reports --configfile=config/config-test.yml --cores 1", description = "Render QC reports for test data" }

# Documentation feature
[feature.docs.dependencies]
python = ">=3.10"

[feature.docs.pypi-dependencies]
zensical = "*"

[feature.docs.tasks]
docs-build = "zensical build"
docs-serve = "zensical serve"

# CUDA runtime libraries for `escpod demux --device gpu`.
#
# onnxruntime itself is NOT here — `ort 2.0.0-rc.13` needs 1.27.x and
# conda-forge stops at 1.26, so it comes from a release tarball via
# `pixi run install-ort-gpu`. What that tarball does NOT bundle is cuDNN: its
# libonnxruntime_providers_cuda.so links libcudnn.so.9, and without it the CUDA
# provider fails to register and silently falls back to CPU ("No execution
# providers ... registered successfully"). These packages supply it.
[feature.gpu]
platforms = ["linux-64"]

# The CUDA packages depend on the `__cuda` virtual package, which conda only
# reports on a machine that has a GPU — declaring it here keeps the environment
# solvable from login and CPU nodes, where the install actually runs.
[feature.gpu.system-requirements]
cuda = "13"

[feature.gpu.dependencies]
cudnn = ">=9,<10"       # libcudnn.so.9 — what the CUDA provider fails without
libcublas = "*"
libcufft = "*"
cuda-cudart = "*"

[environments]
default = []
test = ["test"]
report = ["report"]
docs = { features = ["docs"], solve-group = "default" }
# Standalone solve-group: the "default" group carries the docs feature's PyPI
# dependency, which makes pixi fetch a conda-pypi mapping from a host the
# compute nodes cannot reach.
gpu = ["gpu"]
