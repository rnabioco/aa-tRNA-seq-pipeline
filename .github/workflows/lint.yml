name: Lint

on:
  push:
    branches: [main, master, develop, claude/**, refactor/**]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  snakemake-lint:
    name: Snakemake Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.1

      - name: Run snakefmt check
        run: pixi run lint-snakefmt

  python-lint:
    name: Python Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.1

      - name: Run ruff check and format
        run: pixi run lint-python

  yaml-lint:
    name: YAML Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.1

      - name: Run yamllint
        run: pixi run lint-yaml
