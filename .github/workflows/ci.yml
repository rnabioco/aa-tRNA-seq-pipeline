name: CI

on:
  push:
    branches: [main, master, develop, claude/**, refactor/**]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.1

      - name: Run unit tests with coverage
        run: pixi run -e test pytest tests/unit/ -v --cov=workflow/scripts --cov-report=term-missing

  syntax-check:
    name: Snakemake Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.1

      - name: Verify Snakemake installation
        run: pixi run snakemake --version

      - name: Download test data
        run: pixi run dl-test-data

      - name: Snakemake dry-run (syntax check)
        run: pixi run dry-run

  pipeline-test:
    name: Pipeline Integration Test
    runs-on: ubuntu-latest
    needs: [syntax-check, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.1

      - name: Download test data
        run: pixi run dl-test-data

      - name: Run integration tests
        run: pixi run -e test pytest tests/integration/ -v

  config-validation:
    name: Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.1

      - name: Check config files syntax
        run: |
          # Validate YAML syntax
          pixi run python -c "import yaml; yaml.safe_load(open('config/config-base.yml'))"
          pixi run python -c "import yaml; yaml.safe_load(open('config/config-test.yml'))"
          pixi run python -c "import yaml; yaml.safe_load(open('config/config-preprint.yml'))"
          echo "All config files are valid YAML"

      - name: Check samples files
        run: |
          # Validate samples TSV files exist and have content
          if [ ! -f "config/samples-test.tsv" ]; then
            echo "Error: samples-test.tsv not found"
            exit 1
          fi
          if [ ! -s "config/samples-test.tsv" ]; then
            echo "Error: samples-test.tsv is empty"
            exit 1
          fi
          echo "Sample files validated"

      - name: Check required directories
        run: |
          # Check that required directories exist
          directories=("workflow" "workflow/rules" "workflow/scripts" "config" "resources" "cluster")
          for dir in "${directories[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "Error: Required directory $dir not found"
              exit 1
            fi
          done
          echo "All required directories exist"

