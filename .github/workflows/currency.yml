name: Pin currency

# Weekly: are the pinned model bundles and tool versions still the releases we
# want, and do the vendored copies still match upstream byte-for-byte? This is
# scripts/check-currency.py (`pixi run check-currency`) on a schedule, so a
# stale pin is a red run rather than something noticed the day after the
# release that mattered. A red run is a DECISION to make, not necessarily a
# bump: hold a pin by recording why in resources/models/pins.yml.
#
# The model bundles live in a PRIVATE repo (rnabioco/escapepod-models). The
# default GITHUB_TOKEN cannot list its releases, so that half needs a
# fine-grained personal access token with read access to that repo's contents,
# stored as the repository secret ESCAPEPOD_MODELS_TOKEN. Without it the models
# check reports upstream unreachable and, under --strict, fails -- deliberately,
# so a missing secret is visible rather than a silent pass. The tool repos
# (escapepod-rs, dorado) are public and need no secret.

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays, 13:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  currency:
    name: Pins against upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.10.2

      # Byte identity of what is vendored, from the hashes upstream declares.
      # Needs no network.
      - name: Vendored bundles are byte-for-byte upstream
        run: |
          pixi run verify-demux-model
          pixi run verify-charging-model

      - name: Pins against upstream releases
        env:
          GH_TOKEN: ${{ secrets.ESCAPEPOD_MODELS_TOKEN || github.token }}
        run: pixi run check-currency -- --strict
