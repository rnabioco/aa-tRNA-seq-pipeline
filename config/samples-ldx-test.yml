# Test sample file for LDX (escapepod) demultiplexing.
#
# Points at the checked-in fixture, which is a real pooled barcoded run cut
# down to 415 reads -- see .tests/fixtures/ldx-demux/README.md for how it was
# built and what it contains.
#
# The fixture holds five populations, chosen so that each of them exercises a
# different branch:
#
#   ldx01 + edx01   -> ldx01_edx01, an EDX-FILTERED sample
#   ldx02 + edx02   -> ldx02_edx02, an EDX-FILTERED sample
#   ldx08 (mixed)   -> ldx08_pool,  NOT filtered, keeps every adapter
#   ldx05           -> claimed by no sample, so demux must route it nowhere
#   unclassified    -> reads the CRF could not call
#
# The two filtered samples deliberately carry off-target adapters as well, so
# filter_{fastq,pod5}_by_edx has something real to remove rather than being a
# no-op that still passes.

runs:
  - path: .tests/fixtures/ldx-demux/run
    # No barcode_kit: the LDX model bundle is self-describing and carries its
    # own barcode references. Setting one here would be ignored at best.
    samples:
      ldx01_edx01: {ldx: "ldx01", edx: "edx01"}
      ldx02_edx02: {ldx: "ldx02", edx: "edx02"}
      ldx08_pool: {ldx: "ldx08"}
