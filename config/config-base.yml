# base config for aa-tRNA-seq pipeline
# this is included in the main Snakefile

# either a path to a basecalling model to use with dorado or a model selection name to specify model to download and use
base_calling_model: "resources/models/rna004_130bps_sup@v5.3.0"

# path to fasta file to use for bwa alignment.
# a BWA index will be built if it does not exist for this fasta file
fasta: "resources/ref/sacCer3-mature-tRNAs-dual-adapt-v2.fa"

# Adapter sequences for tRNA reference building/validation
# These must match what the Remora charging model was trained on.
# The charging classification uses the CCAGGC 6-mer junction:
#   CCA = tRNA 3' end (last 3 bases of mature tRNA)
#   GGC = first 3 bases of 3' adapter
# Therefore, the 3' adapter MUST start with GGC for classification to work.
adapters:
  # 5' adapter prepended to tRNA (23bp, the first tRNA base is included as variable N)
  five_prime: "CCTAAGAGCAAGAAGAAGCCTGG"
  # 3' adapter appended after tRNA CCA end (40bp, starts with GGC)
  # Can be a single sequence (string) or list of named adapters for multi-adapter support
  # The dual-adapter reference has charged (edx01) and uncharged (edx02) sequences
  three_prime:
    - name: "edx01"
      seq: "GGCTTCTTCTTGCTCTTCCAACCTTGCCTTAAAAAAAAAA"
    - name: "edx02"
      seq: "GGCTTCTTCTTGCTCTTATGGAAGGTAGGCAAAAAAAAAA"
  # Minimum parasail alignment scores for adapter position detection
  # Note: ~9% of reads have complete 5' adapter (truncation is expected)
  min_score_5p: 25
  min_score_3p: 20
  # Use alignment position to infer 5' adapter presence for truncated reads
  # If ref_start < max_ref_start_for_5p, 5' adapter is considered present
  # Value of 20 means at least 3bp of 23bp adapter is present (23-20=3)
  infer_5p_from_alignment: true
  max_ref_start_for_5p: 20

# Reference validation/building mode
# The pipeline validates that the reference FASTA has proper adapter structure
# before alignment. This ensures the CCAGGC junction exists for charging classification.
#
# Modes:
#   validate: Check existing adapted reference (default)
#   build: Create adapted reference from raw tRNA sequences
reference:
  mode: "validate"
  # For build mode only: path to raw tRNA FASTA (without adapters, must end in CCA)
  raw_fasta: null
  # Optional spacer inserted between CCA and 3' adapter in the reference.
  # Reads will align with a deletion at this position, absorbing signal
  # perturbation from the aminoacyl group on charged tRNAs.
  # Default "" = no spacer (backward compatible). Set to e.g. "T" to enable.
  cca_spacer: ""

# Optional: provide a kmer table to extract signal metrics using remora
# Set to a path (e.g. "resources/kmers/9mer_levels_v1.txt") to enable
# from: https://github.com/nanoporetech/kmer_models/tree/master/rna004
remora_kmer_table: null

# read classification model - remora trained model to classify charged vs uncharged reads
remora_cca_classifier: "resources/models/cca_classifier.pt"

# CCA charging classifier to use: "remora" (default) or "leech"
# Leech is a GPU-accelerated alternative (requires resources/leech submodule)
classifier: "remora"

# AA identity classification using leech one-vs-all bundle (optional)
aa_identity:
  enabled: false
  bundle: ""

# software tools (modkit and remora managed by pixi)
# NOTE: dorado_version and dorado_model are coupled. When upgrading dorado,
# check the release notes for new models:
# https://github.com/nanoporetech/dorado/releases
dorado_version: 2.1.1
dorado_model: rna004_130bps_sup@v5.3.0

# escapepod (`escpod`) version, installed by `pixi run setup` from the pinned
# GitHub release. Provides `escpod demux` for LDX (nbc) barcode
# demultiplexing, and `escpod merge`/`escpod filter` for the POD5 handling that
# used to shell out to the `pod5` CLI.
#
# 0.8.1 is the floor, and the reason is a correctness one rather than a feature:
# escpod before 0.8.1 could emit a POD5 whose signal batches break stride, which
# dorado then reads SHORT — silently, no error, no non-zero exit. On the
# 2026-08-06 run that cost 97,790 reads (10.6%) and looked like biology.
# 0.8.1 also carries the multi-input `filter` that `split_pod5` needs, and the
# `boundary.margin` / `boundary.clamp_max_shift` bundle keys the vendored nbc16
# model declares.
escpod_version: 0.8.1

# modkit threshold parameters for modification calling
# optimized thresholds based on ModkitOpt (Sneddon et al. 2025)
# see https://github.com/comprna/modkitopt
# these params improve F1 by 51% (m6A) and 1251% (pseU) compared to defaults
modkit:
  # global threshold for canonical base confidence
  filter_threshold: 0.5
  # per-modification pass thresholds (mod code or ChEBI ID : threshold)
  #   a = N6-methyladenosine (m6A)
  #   m = 5-methylcytosine (m5C)
  #   17802 = pseudouridine (pseU)
  #   17596 = inosine
  mod_thresholds:
    a: 0.99
    m: 0.99
    "17802": 0.995
    "17596": 0.99

# Pairwise modification odds ratio parameters
odds_ratios:
  ml_threshold: 200     # CL tag threshold for charged classification
  min_coverage: 10      # minimum reads per tRNA/position pair

# additional options for particular commands
opts:
  # additional options for dorado basecalling
  # XXX place modified bases first as the arg parser gets confused
  # XXX add `-v` for verbose logging
  dorado: " --modified-bases m5C_2OmeC inosine_m6A_2OmeA pseU_2OmeU 2OmeG --emit-moves "

  # additional options for bwa alignment
  # based on Novoa lab optimising bwa for tRNA alignment
  # the -h 20 option is used to increase the number of secondary alignments reported in the XA tag
  bwa: " -W 13 -k 6 -T 20 -x ont2d"

  # requires positive strand alignment
  # requires at least 1 5' adapter base
  # requires 1 3' adapter base in the discriminating adapter region between charged and uncharged (edx01 adapters).
  bam_filter: "-5 24 -3 23 -s"

  # requires positive strand alignment and excludes non-primary alignments
  coverage: "--filterRNAstrand 'reverse' --samFlagExclude 256"

  # pass additional options to get_signal_metrics.py script which uses Remora to calculate metrics
  remora: ""

# WarpDemuX demultiplexing (optional, disabled by default)
#
# For Nano-tRNAseq data, use the WarpDemuX-tRNA models:
#   - WDX4_tRNA_rna004_v1_0 (Recommended) - barcodes: WDX_bc03, WDX_bc04, WDX_bc05, WDX_bc07
#   - WDX4b_tRNA_rna004_v1_0 - barcodes: WDX_bc04, WDX_bc05, WDX_bc07, WDX_bc11
#
# ATTENTION: WarpDemuX-tRNA models are developed for the Nano-tRNAseq protocol
# and do NOT work with data using the Thomas splint adapter.
#
# WDX4_tRNA_rna004_v1_0 has improved recovery (+3-7%) compared to WDX4b_tRNA_rna004_v1_0.
# QC report options
report:
  # path to a .qmd file to include at the end of the QC report (optional)
  custom_include: ""

# Optional QC steps
qc:
  # All-vs-all pairwise reference similarity. Identical sequences are always
  # collapsed before aligning, but the work is still quadratic in the number of
  # DISTINCT sequences.
  reference_similarity: true
  # Skip (with a warning) when the reference exceeds this many sequences. The
  # heatmap stops being legible in the low hundreds, and the dense square TSV
  # grows as n^2. Set to null to disable the guard. Ignored when
  # reference_similarity_max_mismatch is set, since collapsing bounds the
  # output size independently of the input size.
  reference_similarity_max_seqs: 2000
  # Additionally collapse sequences within this Hamming distance of a cluster
  # representative. 0 keeps only the lossless exact-duplicate collapse. Values
  # above 0 are lossy: the matrix is reported over representatives, with
  # membership recorded in reference_similarity.clusters.tsv. Hamming distance
  # requires equal lengths, so sequences differing by an indel never collapse.
  reference_similarity_max_mismatch: 0

# Reuse reference-independent outputs from a previous pipeline run.
# Set to the output_directory of a completed run to skip POD5 merging,
# basecalling, FASTQ extraction, and demultiplexing.
# Both runs must use the same samples/raw data — only reference can differ.
reuse_outputs_from: null

warpdemux:
  enabled: false
  barcode_kit: "WDX4_tRNA_rna004_v1_0"
  save_boundaries: true
  threads: 8

# LDX demultiplexing via escapepod's CTC-CRF barcode basecaller (optional).
#
# LDX is our name for the barcodes escapepod-models calls `nbc01`..`nbc16`.
# This is the successor to the WarpDemuX/WDX path: it reads the barcode out of
# the raw adapter signal with a CRF and matches the decode to references by
# edit distance, rather than classifying boundary-gated fingerprints.
#
# Enable exactly one of `warpdemux.enabled` and `ldx.enabled` — they both
# populate the same per-sample `barcode` field and their rules write the same
# outputs. Assign barcodes with the `ldx:` key in the samples YAML.
#
# The model is a bundle DIRECTORY, not a file, and is self-describing: it
# carries its own barcode references and pins the boundary detector it was
# calibrated against, so no --barcodes and no --method are passed. Do not
# override the detector; LLR boundaries cost 17.2 points of balanced recall and
# fail silently.
ldx:
  enabled: false
  model: "resources/models/demux/barcode_crf_nbc16_rna004@v0.2.0"
  # Samples of adapter_end a read needs beyond the model's chunk (3000) before
  # the CRF will decode it; below that the read routes to `unclassified` with
  # confidence 0, undecoded. `null` leaves the bundle's own declaration in
  # charge, which is where this belongs — set it only to evaluate a margin the
  # bundle has not adopted yet.
  #
  # The shipped v0.2.0 bundle declares nothing, so it falls back to 200 (the
  # filter `extract_chunks.py` applied when building the corpus). On the
  # 2026-08-06 nbc16 run that dropped 145,775 reads (14.56%), every one of which
  # HAD a detected adapter; 0 recovers 36,921 of them at median edit distance 0
  # (yield 85.44% -> 89.13%). The rest have adapter_end < 3000 and need a
  # shorter-chunk model, not a margin change.
  boundary_margin: null
  # Run the CRF encoder and boundary CNN on the GPU. Off by default because the
  # RELEASED escpod binary is built without `crf-gpu`/`cnn-gpu` and rejects
  # --gpu outright — enabling this requires an escpod built from source with
  # those features, plus a CUDA-enabled libonnxruntime on ORT_DYLIB_PATH
  # (`pixi install -e gpu` provides one; see the `gpu` feature in pixi.toml).
  # When true, escapepod_demux must also be given a GPU in the cluster profile.
  # The lattice decode stays on the CPU regardless, so threads still matter.
  gpu: false
  # Call a read unclassified when its edit-distance margin to the second-best
  # reference is below this. 0 keeps every call, including outright ties.
  # The model's published precision/recall were computed on this margin, so
  # raising it trades recovery for precision along that curve.
  min_margin: 0
  threads: 16

# EDX (3' adapter barcode) handling.
#
# Two independent things live here, and they are deliberately separable:
#
#   1. FILTERING. Driven per-sample by the `edx:` key in the samples YAML. A
#      sample with `edx: edx01` keeps only its own adapter's reads, so one
#      library pooled across adapters becomes one sample per adapter.
#
#   2. CONCORDANCE. `enabled: true` emits summary/edx/edx_concordance.tsv.gz,
#      the signal-barcode x 3'-adapter contingency table.
#
# `detect_all` decouples them: it runs adapter detection on every sample rather
# than only those carrying an `edx:` assignment. That is what an adapter-ligation
# QC run needs — each signal barcode legitimately holds a MIXTURE of 3' adapters,
# so there is no single adapter to filter to, but the full cross-tabulation is
# precisely the measurement.
edx:
  enabled: false
  detect_all: false
  # Minimum margin between the best and second-best 3' adapter alignment score
  # for a read's adapter call to be counted as CLEAN in the concordance table.
  # Reads below it are still reported, under `ambiguous`. 0 disables the gate.
  # Crosstalk measured without a margin gate is inflated by near-ties, which is
  # why the upstream barcode training corpus gated on margin > 5.
  min_margin: 5

# Amino acid identity classification (optional, disabled by default)
# Uses leech multiclass models to predict which amino acid was charged
# on each tRNA read. Requires a trained multiclass bundle (.pt file).
# The bundle encodes the motif and model architecture; anchor/base_justify
# must match training settings.
classify_aa:
  enabled: false
  bundle: null            # path to multiclass_bundle.pt (required when enabled)
  anchor: "reference"     # must match training: "reference" or "basecall"
  base_justify: "end"     # must match training: "start", "center", or "end"
  device: "cuda"          # "cuda" for GPU, "cpu" for CPU-only
  batch_size: 1024        # chunks per forward pass
  read_batch_size: 10000  # reads per mega-batch (controls peak memory)
  copy_tags: "CL"         # BAM tags to include in TSV output
