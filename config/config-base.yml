# base config for aa-tRNA-seq pipeline
# this is included in the main Snakefile

# either a path to a basecalling model to use with dorado or a model selection name to specify model to download and use
base_calling_model: "resources/models/rna004_130bps_sup@v5.3.0"

# path to fasta file to use for bwa alignment.
# a BWA index will be built if it does not exist for this fasta file
fasta: "resources/ref/sacCer3-mature-tRNAs-dual-adapt-v2.fa"

# Adapter sequences for tRNA reference building/validation
# These must match what the charging model was trained on.
# The charging classification uses the CCAGGC 6-mer junction:
#   CCA = tRNA 3' end (last 3 bases of mature tRNA)
#   GGC = first 3 bases of 3' adapter
# Therefore, the 3' adapter MUST start with GGC for classification to work.
adapters:
  # 5' adapter prepended to tRNA (23bp, the first tRNA base is included as variable N)
  five_prime: "CCTAAGAGCAAGAAGAAGCCTGG"
  # 3' adapter appended after tRNA CCA end (40bp, starts with GGC)
  # Can be a single sequence (string) or list of named adapters for multi-adapter support
  # The dual-adapter reference has charged (edx01) and uncharged (edx02) sequences
  three_prime:
    - name: "edx01"
      seq: "GGCTTCTTCTTGCTCTTCCAACCTTGCCTTAAAAAAAAAA"
    - name: "edx02"
      seq: "GGCTTCTTCTTGCTCTTATGGAAGGTAGGCAAAAAAAAAA"
  # Minimum parasail alignment scores for adapter position detection
  # Note: ~9% of reads have complete 5' adapter (truncation is expected)
  min_score_5p: 25
  min_score_3p: 20
  # Use alignment position to infer 5' adapter presence for truncated reads
  # If ref_start < max_ref_start_for_5p, 5' adapter is considered present
  # Value of 20 means at least 3bp of 23bp adapter is present (23-20=3)
  infer_5p_from_alignment: true
  max_ref_start_for_5p: 20

# Reference validation/building mode
# The pipeline validates that the reference FASTA has proper adapter structure
# before alignment. This ensures the CCAGGC junction exists for charging classification.
#
# Modes:
#   validate: Check existing adapted reference (default)
#   build: Create adapted reference from raw tRNA sequences
reference:
  mode: "validate"
  # For build mode only: path to raw tRNA FASTA (without adapters, must end in CCA)
  raw_fasta: null
  # Optional spacer inserted between CCA and 3' adapter in the reference.
  # Reads will align with a deletion at this position, absorbing signal
  # perturbation from the aminoacyl group on charged tRNAs.
  # Default "" = no spacer (backward compatible). Set to e.g. "T" to enable.
  cca_spacer: ""

# Charged vs uncharged tRNA classification, via `escpod signal classify`.
charging:
  # Model bundle DIRECTORY, not a file. It is self-describing: it carries the
  # anchor definition, the feature recipe, the k-mer table it is defined
  # against (pinned by sha256), the abstain rule and the recommended operating
  # point, so nothing below is passed as a flag. See the README beside it.
  model: "resources/models/charging/charging_feature_nn_rna004@v0.1.0"

  # Minimum mapping quality for a read to be classified. 0, not escpod's
  # default of 1, and deliberately: tRNA references are highly redundant, so a
  # read that maps equally well to two isodecoders gets mapq 0 from bwa and is
  # a perfectly good read. On the test data `--min-mapq 1` drops 118 of 209
  # records (56%); 0 classifies exactly the 187 reads Remora did.
  min_mapq: 0

  # `cl` at or above this is called charged. The bundle declares its own
  # recommended operating point (`operating_point.cl`) and this must match it
  # — 200, i.e. P(charged) >= 0.7824. It is a RECOMMENDATION measured on
  # held-out data, not a property of the model: precision depends on the
  # sample's charged fraction, so 95% precision needs cl >= 205 at f=0.25 but
  # cl >= 254 at f=0.05. Move it for a different precision, and say so.
  ml_threshold: 200

# software tools (modkit managed by pixi)
# NOTE: dorado_version and dorado_model are coupled. When upgrading dorado,
# check the release notes for new models:
# https://github.com/nanoporetech/dorado/releases
dorado_version: 2.1.1
dorado_model: rna004_130bps_sup@v5.3.0

# escapepod (`escpod`) version, installed by `pixi run setup` from the pinned
# GitHub release. It is on the critical path of every run, not just demux runs:
# `escpod merge`/`escpod filter` do the POD5 handling that used to shell out to
# the `pod5` CLI, `escpod signal classify` is the charging classifier, and
# `escpod demux` is the LDX (nbc) barcode demultiplexer.
#
# 0.10.0 is the floor for the charging model. The vendored bundle is the
# per-base-feature ONNX variant, which escpod reads from escapepod-rs#231
# onward; an older binary refuses it outright with `missing field \`gbm\``. So
# the runtime is pinned alongside the model, not independently of it.
#
# 0.11.0 brought two fixes to that classifier:
#   - the bundle's abstain rule is actually applied. Before, it was parsed and
#     dropped, so ~0.85% of scoreable reads — reads of something else, mostly
#     the wrong strand of the duplex — got a confident `cl` like any other.
#   - `--tsv` gained the `reason` column, so every read the model did not score
#     says why instead of silently vanishing. That is what feeds
#     `read_attrition.tsv.gz`.
#
# 0.12.0 is what we run, for the demux side. `--ref-scores` computes
# log P(barcode | signal) from the CRF lattice itself, so a demux call finally
# carries a continuous per-read confidence instead of only the edit-distance
# margin a designed panel pins to three values (escapepod-rs#241). See
# `ldx.ref_scores` below for what that buys and what it still does not.
#
# 0.12.0 is ALSO the floor for scoring on the sidecar path: it made `.p5s`
# columns numeric. Before it a sidecar held dictionary-encoded labels only, so
# a sidecar-only run computed crf_logp and then had nowhere to put it.
#
# Three earlier floors still hold, and are why this must not be moved backwards
# even for a run that does no charging classification:
#   - 0.9.0 added the `.p5s` sidecar and `demux --annotate`, which is what lets
#     the LDX path record barcode assignments beside the raw POD5 instead of
#     routing reads into per-barcode copies of it.
#   - 0.8.1 fixed a correctness bug, not a feature gap: escpod before it could
#     emit a POD5 whose signal batches break stride, which dorado then reads
#     SHORT — silently, no error, no non-zero exit. On the 2026-08-06 run that
#     cost 97,790 reads (10.6%) and looked like biology.
#   - 0.8.1 also carries the multi-input `filter` that `split_pod5` needs, and
#     the `boundary.margin` / `boundary.clamp_max_shift` bundle keys the
#     vendored nbc16 model declares.
escpod_version: 0.12.0

# modkit threshold parameters for modification calling
# optimized thresholds based on ModkitOpt (Sneddon et al. 2025)
# see https://github.com/comprna/modkitopt
# these params improve F1 by 51% (m6A) and 1251% (pseU) compared to defaults
modkit:
  # global threshold for canonical base confidence
  filter_threshold: 0.5
  # per-modification pass thresholds (mod code or ChEBI ID : threshold)
  #   a = N6-methyladenosine (m6A)
  #   m = 5-methylcytosine (m5C)
  #   17802 = pseudouridine (pseU)
  #   17596 = inosine
  mod_thresholds:
    a: 0.99
    m: 0.99
    "17802": 0.995
    "17596": 0.99

# Pairwise modification odds ratio parameters
odds_ratios:
  ml_threshold: 200     # CL tag threshold for charged classification
  min_coverage: 10      # minimum reads per tRNA/position pair

# additional options for particular commands
opts:
  # additional options for dorado basecalling
  # XXX place modified bases first as the arg parser gets confused
  # XXX add `-v` for verbose logging
  dorado: " --modified-bases m5C_2OmeC inosine_m6A_2OmeA pseU_2OmeU 2OmeG --emit-moves "

  # additional options for bwa alignment
  # based on Novoa lab optimising bwa for tRNA alignment
  # the -h 20 option is used to increase the number of secondary alignments reported in the XA tag
  bwa: " -W 13 -k 6 -T 20 -x ont2d"

  # requires positive strand alignment
  # requires at least 1 5' adapter base
  # requires 1 3' adapter base in the discriminating adapter region between charged and uncharged (edx01 adapters).
  bam_filter: "-5 24 -3 23 -s"

  # requires positive strand alignment and excludes non-primary alignments
  coverage: "--filterRNAstrand 'reverse' --samFlagExclude 256"

# WarpDemuX demultiplexing (optional, disabled by default)
#
# For Nano-tRNAseq data, use the WarpDemuX-tRNA models:
#   - WDX4_tRNA_rna004_v1_0 (Recommended) - barcodes: WDX_bc03, WDX_bc04, WDX_bc05, WDX_bc07
#   - WDX4b_tRNA_rna004_v1_0 - barcodes: WDX_bc04, WDX_bc05, WDX_bc07, WDX_bc11
#
# ATTENTION: WarpDemuX-tRNA models are developed for the Nano-tRNAseq protocol
# and do NOT work with data using the Thomas splint adapter.
#
# WDX4_tRNA_rna004_v1_0 has improved recovery (+3-7%) compared to WDX4b_tRNA_rna004_v1_0.
# QC report options
report:
  # path to a .qmd file to include at the end of the QC report (optional)
  custom_include: ""

# Optional QC steps
qc:
  # All-vs-all pairwise reference similarity. Identical sequences are always
  # collapsed before aligning, but the work is still quadratic in the number of
  # DISTINCT sequences.
  reference_similarity: true
  # Skip (with a warning) when the reference exceeds this many sequences. The
  # heatmap stops being legible in the low hundreds, and the dense square TSV
  # grows as n^2. Set to null to disable the guard. Ignored when
  # reference_similarity_max_mismatch is set, since collapsing bounds the
  # output size independently of the input size.
  reference_similarity_max_seqs: 2000
  # Additionally collapse sequences within this Hamming distance of a cluster
  # representative. 0 keeps only the lossless exact-duplicate collapse. Values
  # above 0 are lossy: the matrix is reported over representatives, with
  # membership recorded in reference_similarity.clusters.tsv. Hamming distance
  # requires equal lengths, so sequences differing by an indel never collapse.
  reference_similarity_max_mismatch: 0

# Reuse reference-independent outputs from a previous pipeline run.
# Set to the output_directory of a completed run to skip POD5 merging,
# basecalling, FASTQ extraction, and demultiplexing.
# Both runs must use the same samples/raw data — only reference can differ.
reuse_outputs_from: null

warpdemux:
  enabled: false
  barcode_kit: "WDX4_tRNA_rna004_v1_0"
  save_boundaries: true
  threads: 8

# LDX demultiplexing via escapepod's CTC-CRF barcode basecaller (optional).
#
# LDX is our name for the barcodes escapepod-models calls `nbc01`..`nbc16`.
# This is the successor to the WarpDemuX/WDX path: it reads the barcode out of
# the raw adapter signal with a CRF and matches the decode to references by
# edit distance, rather than classifying boundary-gated fingerprints.
#
# Enable exactly one of `warpdemux.enabled` and `ldx.enabled` — they both
# populate the same per-sample `barcode` field and their rules write the same
# outputs. Assign barcodes with the `ldx:` key in the samples YAML.
#
# The model is a bundle DIRECTORY, not a file, and is self-describing: it
# carries its own barcode references and pins the boundary detector it was
# calibrated against, so no --barcodes and no --method are passed. Do not
# override the detector; LLR boundaries cost 17.2 points of balanced recall and
# fail silently.
ldx:
  enabled: false
  model: "resources/models/demux/barcode_crf_ldx16_rna004@v0.1.0"

  # --- Boundary gating -----------------------------------------------------
  # BOTH of the next two values are set HERE, not in the bundle, and that is
  # deliberate. No CRF bundle upstream has ever declared either key —
  # `build_crf_bundle.py` cannot write them — so a bundle that appears to
  # declare one has been edited locally. We did exactly that to nbc16 in #107
  # and #108; it broke that bundle's own SHA256SUMS for eleven days and then
  # read as evidence that a later release had *removed* the keys. Vendored
  # bundles are now byte-for-byte upstream, and the overrides live here where
  # they are visible and diffable.

  # Samples of adapter_end a read needs beyond the model's chunk (3000) before
  # the CRF will decode it; below that the read routes to `unclassified` with
  # confidence 0, undecoded. Unset would inherit escpod's fallback of 200 —
  # which records only how `extract_chunks.py` FILTERED the training corpus,
  # not what the encoder needs: adapter_end >= chunk already yields a full
  # window.
  #
  # 0, measured: on the 1.0M-read 2026-08-06 nbc16 run the 200 fallback dropped
  # 145,775 reads (14.56%), every one of which HAD a detected adapter; 0
  # recovers 36,921 of them at median edit distance 0, 98.3% within 2 edits —
  # cleaner than the reads that already passed (yield 85.44% -> 89.13%). Reads
  # with adapter_end < 3000 are out of its reach and need the clamp below.
  boundary_margin: 0

  # Decode a read whose adapter ends BEFORE the chunk from the window
  # [0, chunk], provided chunk - adapter_end is at most this. 0 disables it.
  # `boundary_margin` cannot reach these reads: their window would start before
  # sample 0, so there is nothing to relax. Clamping keeps the window width and
  # anchors it at the read start instead. Such reads are truncated mid-adapter,
  # so part of the barcode is already gone; this bounds how much of that we
  # accept.
  #
  # 300 on the 415-read LDX fixture is worth 11 reads (379/415 -> 390/415).
  clamp_max_shift: 300
  # Run the CRF encoder and boundary CNN on the GPU. Measured on the 2026-08-06
  # flowcell (1,001,307 reads, --ref-scores on), one GPU + 8 cores against the
  # released CPU binary on 32 cores:
  #
  #   CPU   ~2.6 h    108 reads/s   92.22% yield
  #   GPU   458.9 s  2,182 reads/s  92.22% yield    <- 20.3x, quarter the cores
  #
  # Identical yield; the stage trace shows the device saturated (workers busy
  # 94% of wall), so a second GPU would push further. The lattice decode stays
  # on the CPU regardless, so `threads` still matters.
  #
  # THIS REQUIRES A SOURCE BUILD. The released escpod carries no GPU code and
  # rejects --gpu as an unknown argument, so `escapepod_demux` resolves the
  # locally built `<escpod_version>-gpu` binary instead (see get_escpod_bin in
  # demux.smk) and fails loudly naming the build command if it is missing.
  # `escpod_version` itself stays on the release — every other rule uses it.
  #
  # Also needs a CUDA libonnxruntime on ORT_DYLIB_PATH (`pixi run
  # install-ort-gpu`) and cuDNN (`pixi install -e gpu`). Without cuDNN the CUDA
  # provider fails to register and onnxruntime falls back to the CPU with only a
  # warning — confirm the log says `CRF encoder: N worker(s) on GPU [0]`.
  #
  # Set false for a CPU-only host; the test configs do exactly that.
  gpu: true
  # Call a read unclassified when its edit-distance margin to the second-best
  # reference is below this. RETIRED to 0 in favour of the lattice gate below;
  # what follows is why it was 12, and why that stopped being the right value.
  #
  # The margin is quantised: on a 1,001,307-read RNA004 run, 99.0% of classified
  # reads sit at 12/13/14, because the 16 references are >=12 apart by design and
  # a WRONG decode lands just as cleanly on its reference as a right one. So the
  # residual error rate barely moves — which made 12 look useless until you asked
  # what it DISCARDS. Measured against a second, independently trained bundle
  # (disagreement between two models is a floor on error):
  #
  #   threshold  drops        of calls   of which disagreements
  #        1     1,295         0.14%          96.2%
  #       10     7,427         0.80%          91.3%
  #       12     8,817         0.95%          85.2%   <- the old default
  #       13   431,747        46.76%           8.5%   <- cliff, do not
  #
  # That was an 11:1 trade and the right one WHILE it was the only gate. Its
  # ceiling was always low: only ~1% of reads have a sub-plateau margin, so ~90%
  # of errors were out of its reach entirely.
  #
  # `min_crf_margin` below reaches them, and once it is on, 12 is not
  # complementary — it is redundant and then harmful. Re-measured on the same
  # run (2026-08-20, 923,431 calls, 77,618 cross-bundle disagreements), what
  # min_margin 12 removes ON TOP of the lattice gate:
  #
  #   crf gate   extra reads dropped   of which real errors
  #     0.5             1,157                 36.3%
  #     0.7               855                 19.2%
  #     1.0               728                  9.5%   <- at the shipped gate
  #     2.3               666                  3.5%
  #
  # At the shipped crf 1.0 it discards 728 reads that are 90.5% CORRECT and moves
  # total error removed by +0.09 points. The lattice gate's own discards are
  # ~85% real errors, so keeping 12 only lowers the average quality of what the
  # pipeline throws away.
  #
  # Raise it again only for a run with no lattice gate. Leave it 0 when the
  # measurement IS the crosstalk — gating removes the very reads such a run
  # exists to count.
  min_margin: 0

  # --- The lattice's own confidence ----------------------------------------
  # `--ref-scores` restricts the CRF forward recursion to the paths that emit a
  # given reference and normalises by the full partition function, which is a
  # real log P(barcode | signal):
  #
  #     crf_logp = logZ_target(reference) - logZ_full
  #
  # It adds four columns to classifications.csv — `crf_logp`, `crf_best` (the
  # reference the lattice itself prefers, which need not be the one edit
  # distance called), `crf_margin` (log-odds in nats against the runner-up) and
  # `mean_logpost`. That is resolution `confidence` does not have: over 20k
  # RNA004 reads `confidence` takes 15 distinct values with 98.7% of reads in
  # three of them, while `crf_margin` takes 14,818 over 16,747 reads.
  #
  # On by default, because it is exactly the audit record classifications.csv
  # is kept for, and it is cheap: +3.6% on the fused command. It costs MORE
  # under `gpu: true` — the constrained scan reads the raw scores, so the
  # decode returns to the host while the encoder stays on the device.
  ref_scores: true

  # Gates on that score. Below either threshold a read becomes `unclassified`
  # rather than a possibly-wrong assignment, and keeps its scores in the CSV so
  # the row still says which gate dropped it and by how much. Setting either
  # implies `--ref-scores`.
  #
  # Swept on the 2026-08-06 donor flowcell (1,001,307 reads; 923,431 calls at
  # margin 0), scoring precision against a second, independently trained bundle
  # exactly as the min_margin table above does — 77,618 of those calls are
  # cross-bundle disagreements, which is a floor on the error rate:
  #
  #   gate                 recall%   of all errors removed   discard precision%
  #   min_margin 12         91.34            9.52                  83.78
  #   min_crf_margin 0.5    89.53           29.87                  86.12
  #   min_crf_margin 0.7    88.74           38.59                  85.84
  #   min_crf_margin 1.0    87.85           47.69                  84.56   <- set
  #   min_crf_margin 2.3    85.59           64.48                  75.38
  #   min_crf_margin 4.6    80.18           77.71                  50.02
  #
  # 1.0 is where the dial stops being free. Its discards are 84.56% real errors
  # — the same quality as min_margin 12's 83.78% — while removing 47.69% of all
  # error against that gate's 9.52%: five times the error for the same discard
  # precision, costing 3.5 points of recall. Past ~1.3 discard precision decays,
  # and by 4.6 half of what is dropped is correct, which is yield burnt for
  # nothing.
  #
  # Measured on the GPU (onnxruntime) encoder, unlike the CPU-measured
  # min_margin table above. Calls agree with the CPU (tract) encoder on 99.76%
  # of fixture reads and crf_margin differs at a median of 0.0016 nats, so the
  # threshold is not sensitive to that difference — but it is the reason the two
  # tables are not strictly one measurement.
  #
  #   min_crf_margin — nats of log-odds for the CALLED barcode against its best
  #     alternative. Continuous, and negative when the lattice prefers a
  #     different reference, so any positive threshold rejects both the
  #     ambiguous reads and the ones the lattice actively disagrees with. On
  #     this run 9,617 of 9,618 such reads have a negative margin, and 87.9% of
  #     them are genuine cross-bundle disagreements.
  #     0.7 nats is 2:1 odds, 2.3 is 10:1, 4.6 is 100:1.
  #   min_crf_prob — P(called barcode | signal) in absolute terms. A different
  #     cut, not a rescaling of the same one: a read can be sure it is none of
  #     the other 15 barcodes and still put little mass on any reference at all.
  #     Left unset; the margin gate is the one that was swept.
  min_crf_margin: 1.0
  min_crf_prob: null

  threads: 16

# EDX (3' adapter barcode) handling.
#
# Two independent things live here, and they are deliberately separable:
#
#   1. FILTERING. Driven per-sample by the `edx:` key in the samples YAML. A
#      sample with `edx: edx01` keeps only its own adapter's reads, so one
#      library pooled across adapters becomes one sample per adapter.
#
#   2. CONCORDANCE. `enabled: true` emits summary/edx/edx_concordance.tsv.gz,
#      the signal-barcode x 3'-adapter contingency table.
#
# `detect_all` decouples them: it runs adapter detection on every sample rather
# than only those carrying an `edx:` assignment. That is what an adapter-ligation
# QC run needs — each signal barcode legitimately holds a MIXTURE of 3' adapters,
# so there is no single adapter to filter to, but the full cross-tabulation is
# precisely the measurement.
edx:
  enabled: false
  detect_all: false
  # Minimum margin between the best and second-best 3' adapter alignment score
  # for a read's adapter call to be counted as CLEAN in the concordance table.
  # Reads below it are still reported, under `ambiguous`. 0 disables the gate.
  # Crosstalk measured without a margin gate is inflated by near-ties, which is
  # why the upstream barcode training corpus gated on margin > 5.
  min_margin: 5
