# base config for aa-tRNA-seq pipeline
# this is included in the main Snakefile

# either a path to a basecalling model to use with dorado or a model selection name to specify model to download and use
base_calling_model: "resources/models/rna004_sup@v6.0.0"

# path to fasta file to use for bwa alignment.
# a BWA index will be built if it does not exist for this fasta file
fasta: "resources/ref/sacCer3-mature-tRNAs-dual-adapt-v2.fa"

# Adapter sequences for tRNA reference building/validation
# These must match what the charging model was trained on.
# The charging classification uses the CCAGGC 6-mer junction:
#   CCA = tRNA 3' end (last 3 bases of mature tRNA)
#   GGC = first 3 bases of 3' adapter
# Therefore, the 3' adapter MUST start with GGC for classification to work.
adapters:
  # 5' adapter prepended to tRNA (23bp, the first tRNA base is included as variable N)
  five_prime: "CCTAAGAGCAAGAAGAAGCCTGG"
  # 3' adapter appended after tRNA CCA end (40bp, starts with GGC)
  # Can be a single sequence (string) or list of named adapters for multi-adapter support
  # The dual-adapter reference has charged (edx01) and uncharged (edx02) sequences
  three_prime:
    - name: "edx01"
      seq: "GGCTTCTTCTTGCTCTTCCAACCTTGCCTTAAAAAAAAAA"
    - name: "edx02"
      seq: "GGCTTCTTCTTGCTCTTATGGAAGGTAGGCAAAAAAAAAA"
  # Minimum parasail alignment scores for adapter position detection
  # Note: ~9% of reads have complete 5' adapter (truncation is expected)
  min_score_5p: 25
  min_score_3p: 20
  # Use alignment position to infer 5' adapter presence for truncated reads
  # If ref_start < max_ref_start_for_5p, 5' adapter is considered present
  # Value of 20 means at least 3bp of 23bp adapter is present (23-20=3)
  infer_5p_from_alignment: true
  max_ref_start_for_5p: 20

# Reference validation/building mode
# The pipeline validates that the reference FASTA has proper adapter structure
# before alignment. This ensures the CCAGGC junction exists for charging classification.
#
# Modes:
#   validate: Check existing adapted reference (default)
#   build: Create adapted reference from raw tRNA sequences
reference:
  mode: "validate"
  # For build mode only: path to raw tRNA FASTA (without adapters, must end in CCA)
  raw_fasta: null
  # Optional spacer inserted between CCA and 3' adapter in the reference.
  # Reads will align with a deletion at this position, absorbing signal
  # perturbation from the aminoacyl group on charged tRNAs.
  # Default "" = no spacer (backward compatible). Set to e.g. "T" to enable.
  cca_spacer: ""
  # For build mode only: also merge sequences within this many substitutions of
  # a cluster representative. 0 (default) collapses exact duplicates only, which
  # is lossless. Above 0 is lossy and reduces the reference: merged tRNAs share
  # one name, so charging and CPM can no longer be resolved between them. See
  # reference/build_report.txt for exactly what was merged. Distance is measured
  # on the raw input sequences, before CCA is appended, and only between
  # equal-length sequences, so molecules differing by an indel never merge.
  max_mismatch: 0

# Charged vs uncharged tRNA classification, via `escpod classify`.
charging:
  # Model bundle DIRECTORY, not a file. It is self-describing: it carries the
  # anchor definition, the feature recipe, the k-mer table it is defined
  # against (pinned by sha256), the abstain rule and the recommended operating
  # point, so nothing below is passed as a flag. See the README beside it.
  model: "resources/models/charging/charging_feature_nn_sup6_rna004@v0.1.0"

  # Minimum mapping quality for a read to be classified. 0, not escpod's
  # default of 1, and deliberately: tRNA references are highly redundant, so a
  # read that maps equally well to two isodecoders gets mapq 0 from bwa and is
  # a perfectly good read. On the test data `--min-mapq 1` drops 118 of 209
  # records (56%); 0 classifies exactly the 187 reads Remora did.
  min_mapq: 0

  # Which way round the move table runs against the signal. `escpod classify`
  # normally works this out from the data (`auto`), but that needs >= 50
  # informative reads and a 95% consensus, and below that floor it is a hard
  # ERROR rather than a warning: the sample fails with "orientation check
  # underpowered: N informative reads (need 50)".
  #
  # A sample only gets that shallow when a run is split many ways. At 224
  # samples per flow cell a sparse condition can land ~20 anchored reads, and
  # one such sample fails `rule all` for the whole run, since every sample owes
  # a charging table.
  #
  #   auto      detect per sample (default, and the only safe choice at depth)
  #   time      force the frame RNA004 basecalls use
  #   reversed  force the opposite
  #
  # DO NOT carry a value between projects. The frame follows the chemistry and
  # the basecaller, so it has to be re-derived per run -- and it can be, because
  # every sample deep enough for `auto` records what it found:
  #
  #   grep -h "move-table frame" <outdir>/logs/classify_charging/* \
  #     | sort | uniq -c
  #
  # It is a RUN-level property and in practice unanimous. Measured on the
  # 2026-09-05 GlnRS flow cells: 446 samples, 8,057,646 votes, `reversed`
  # every time and not one `time` vote. So forcing a frame for the handful of
  # samples below the floor is inheriting what the same flow cells measured
  # hundreds of times over, not guessing -- provided you read it off THIS run.
  #
  # A forced frame that is wrong does not error: it mis-anchors every feature
  # and the charging calls silently become noise. If the deep samples of a run
  # disagree with each other, do not set this at all -- something else is wrong.
  #
  # Note what forcing buys. It makes a thin sample COMPLETE, not meaningful: a
  # sample that fails `auto` has tens of reads, and a charging fraction over ~8
  # reads carries a Wilson interval wide enough to be useless. It lets a run
  # finish with every sample owning a table; keep excluding those samples from
  # means and fits on a depth guard downstream.
  orientation: auto

  # The frame to use for a sample `auto` could not decide, INSTEAD of failing
  # it. Only consulted when `orientation: auto` and only for the specific
  # "orientation check underpowered" error -- any other classify failure is
  # still a failure, and is not retried or masked.
  #
  # This is the default rather than a bare `orientation: reversed` because
  # detection is worth keeping wherever it is possible. The two inputs that
  # determine the frame are already pinned and enforced here --
  # `base_calling_model` is rna004_sup@v6.0.0 and `charging.basecaller_check`
  # is a hard error on a mismatch -- so the frame is effectively a constant,
  # and `reversed` is what 8,057,646 votes across 446 samples of the
  # 2026-09-05 GlnRS flow cells returned, with zero dissent. But forcing it
  # everywhere would stop escpod computing that consensus at all, and it is a
  # free tripwire: if the chemistry or basecaller ever shifted in a way the
  # pins did not catch, a deep sample would say so in its log. Detect where
  # detection works, inherit the known value where it cannot.
  #
  #   reversed  the measured frame for rna004_sup@v6.0.0 (default)
  #   time      the other frame
  #   none      no fallback -- an underpowered sample fails the run, which is
  #             the v0.7.2 behaviour
  #
  # The measurement behind `reversed` is specific to rna004_sup@v6.0.0. The
  # other vendored bundle (charging_feature_nn_rna004@v0.1.1, for v5.3.0
  # basecalls) has NOT been measured; on that path, confirm from a deep
  # sample's own log with the grep above before trusting this default.
  #
  # Every fallback is announced in the sample's classify log, so a run always
  # records which samples had a frame supplied rather than detected.
  orientation_fallback: reversed

  # `cl` at or above this is called charged. The bundle declares its own
  # recommended operating point (`operating_point.cl`) and this must match it
  # — 200, i.e. P(charged) >= 0.7824. It is a RECOMMENDATION measured on
  # held-out data, not a property of the model: precision depends on the
  # sample's charged fraction, so 95% precision needs cl >= 205 at f=0.25 but
  # cl >= 254 at f=0.05. Move it for a different precision, and say so.
  ml_threshold: 200

  # How hard to enforce the bundle's `basecaller` declaration (escapepod-models
  # #106): `error` (default), `warn`, or `off`.
  #
  # The bundle names the basecalling MODEL it was trained against, and that is
  # what this gates on — not the dorado version. The charging feature set is
  # mean + z-scored k-mer residual with the expected level predicted from the
  # read's own basecall, so the model substantially detects HOW THE BASECALLER
  # FAILS at the aminoacyl adduct; run it on another basecaller's output and the
  # dominant feature means something else. Measured upstream: ~0.0097 AUROC,
  # 3.0-3.2 pp of TPR, 3.9% of per-read calls flipped — while the aggregate
  # charged fraction moves 0.04 pp, so the one number anyone checks reads "no
  # change". escpod states the declaration at load and does NOT enforce it,
  # which is why this exists.
  #
  # `warn` is the setting for a deliberate cross-basecaller run: arm-to-arm
  # contrasts that share one basecaller survive the shift, absolute charged
  # fractions do not. `off` silences the dorado-version warning too.
  #
  # The DORADO VERSION is checked separately and only ever WARNS, at a major
  # difference. Same weights run by a later dorado are still the same weights,
  # so it cannot justify blocking a run — but a major bump is a different
  # implementation and can move basecalls with the weights unchanged. Since the
  # v6 switch both sides agree exactly (the bundle declares 2.1.1+d66c17c, which
  # is the binary `pixi run setup` installs), so neither check says anything.
  #
  # Neither check reads the model. `pixi run verify-basecaller` is the one that
  # proves byte identity against the declared `model_sha256`, because it hashes
  # ~300 MB and has no business running every time the DAG is built.
  basecaller_check: error

  # Score the windowed (TCN) charging bundle on the GPU: `escpod classify
  # --device gpu` instead of `--device cpu`, via the same GPU-build escpod
  # `ldx.gpu` already uses (get_charging_escpod_gpu_bin in common.smk). Has no
  # effect on the shipped GBM/feature-network bundles (charging_feature_nn_*),
  # which have no GPU path and log a one-line note instead of erroring.
  #
  # Needs escpod >= 0.23.0 (escapepod-rs#344) and a CUDA-visible node, but NOT
  # the onnxruntime/cuDNN install `ldx.gpu` needs: this path runs through
  # tract-cuda/cudarc, which compiles its kernels at run time against the
  # node's own CUDA toolkit rather than a vendored onnxruntime.
  #
  # Default false, unlike `ldx.gpu`. Not a caution about the flag itself --
  # escapepod-rs#343's investigation closed with fifteen real-data runs across
  # two independent datasets bit-for-bit identical to the CPU scorer, zero
  # flipped calls -- but escpod's own CHANGELOG still flags a separate, rare
  # (1-in-51 trials) anomaly with the same failure signature that turned up
  # once and has not recurred; the module doc names it as what would justify
  # closing the gate again. Nothing here has been measured on THIS pipeline's
  # own data yet either. Flip it after that measurement, the way `ldx.gpu`
  # was, not before.
  gpu: false

# software tools (modkit managed by pixi)
# NOTE: dorado_version and dorado_model are coupled. When upgrading dorado,
# check the release notes for new models:
# https://github.com/nanoporetech/dorado/releases
# The dorado pin is also coupled to the CHARGING BUNDLE, which declares the
# basecaller it was trained against (2.1.1+d66c17c today; see `charging`
# below), so it is held in resources/models/pins.yml rather than following
# upstream. `pixi run check-escpod` reports the drift with that reason.
dorado_version: 2.1.1
dorado_model: rna004_sup@v6.0.0

# escapepod (`escpod`) version, installed by `pixi run setup` from the pinned
# GitHub release. It is on the critical path of every run, not just demux runs:
# `escpod merge`/`escpod filter` do the POD5 handling that used to shell out to
# the `pod5` CLI, `escpod classify` is the charging classifier, and
# `escpod demux` is the LDX barcode demultiplexer.
#
# A bump is TWO edits that have to agree: this pin and the SHA256 constants in
# scripts/setup-tools.sh, copied from the release's SHA256SUMS.txt. `pixi run
# check-escpod` (weekly in CI as .github/workflows/currency.yml) reports a pin
# upstream has superseded and a checksum that disagrees with the pinned release;
# a deliberate hold goes in resources/models/pins.yml under `tools:`.
#
# 0.19.0 is the FLOOR FOR THE VENDORED CHARGING BUNDLE, which is why the two
# are bumped together. `charging_feature_nn_rna004@v0.1.1` declares a top-level
# `basecaller` block (escapepod-models#106) and a charging bundle's schema is
# `deny_unknown_fields` — deliberately, since a key in a charging bundle is a
# rule the model was built with and dropping one silently is how a read gets a
# confident wrong answer. So every escpod before 0.19.0 refuses this bundle
# outright with ``unknown field `basecaller` ``. Verified in both directions:
# 0.19.0 scores the fixture, 0.18.1 will not open the file.
#
# 0.10.0 was the previous floor, for the per-base-feature ONNX variant itself,
# which escpod reads from escapepod-rs#231 onward; older still refuses it with
# `missing field \`gbm\``. Either way the runtime is pinned alongside the model
# rather than independently of it.
#
# 0.11.0 brought two fixes to that classifier:
#   - the bundle's abstain rule is actually applied. Before, it was parsed and
#     dropped, so ~0.85% of scoreable reads — reads of something else, mostly
#     the wrong strand of the duplex — got a confident `cl` like any other.
#   - `--tsv` gained the `reason` column, so every read the model did not score
#     says why instead of silently vanishing. That is what feeds
#     `read_attrition.tsv.gz`.
#
# 0.20.0 is what we run. It changes nothing this pipeline calls -- flags,
# outputs and sidecar shape are 0.19.0's -- and brings performance and
# hardening: the CPU boundary CNN loads with its input shape pinned and its
# padding hoisted (600 -> 380 CPU-seconds on 119k reads, sorted per-read
# classifications identical), per-read work on the LLR path is bounded so one
# stalled-pore read no longer holds a worker for seconds, a failed GPU
# `--ref-scores` panel upload is reported once at the end of the run instead of
# retried every batch, and a reads-table row that fails to decode is warned
# about instead of vanishing from every demux stage. It does NOT change the
# rule that keeps the FDX axis a second pass: in a multi-model run the boundary
# flags are still refused when any model anchors on the read end (see `fdx`).
#
# 0.19.0 changed two things this pipeline depends on:
#   - ONE `.p5s` per DIRECTORY. `escpod demux --annotate` pointed at a directory
#     now writes a single COLLECTION sidecar beside it (`run/pod5/` gets one
#     `run/pod5.p5s`) instead of one per member file: a run of fifty POD5s
#     produced one set of barcode calls, not fifty. Pointed at FILES it still
#     writes a sidecar each, so `escapepod_demux` passes the POD5 DIRECTORIES
#     rather than a `*.pod5` glob — the release alone does not get you the new
#     shape, the argument does. Declared as `escapepod:p5s_version` 3, and an
#     escpod that predates it refuses a collection by name rather than misreading
#     it, so a mixed-version tree fails loudly. Nothing else had to change:
#     a POD5 is matched against its own `.p5s` first and then the collection
#     beside its directory, and a member is given rows only when its footer UUID
#     and byte size match the collection's entry for it.
#   - `escpod classify` is `escpod classify` again, and the `signal` group
#     is now the hidden deprecated alias. This is NOT a floor: 0.18.1 already
#     carried `escpod classify` as the alias in the other direction, so both
#     spellings run on both releases. The rules use the current one; the only
#     user-visible difference is the `@PG` line on the output BAM.
#
# It also carries a fix that matters for the NEXT charging bundle rather than the
# vendored one: `MetaFile` now accepts a top-level `basecaller` block, which
# escapepod-models#106 started emitting and which every escpod before this
# refused outright (`unknown field \`basecaller\``). Absent still means "not
# declared", so the bundle here loads on either version.
#
# 0.18.1 is a CORRECTNESS floor for `classify` against any reference whose tRNA
# bodies are not sacCer3's. The CCA|adapter
# junction was located by requiring `CCAGGC` to occur exactly once per reference
# record, and that check ran BEFORE the common-arm check that actually
# identifies the junction. But the motif is just CCA plus the adapter's opening
# bases, and a 6-mer collides over ~75 nt of tRNA body in ~1.5% of records — 4
# of 282 in hg38, 51 of 3315 in danRer11. One such record aborted the entire run
# for that sample. Dropping the offenders is NOT a neutral workaround: 48 of
# danRer11's 51 are Glu, so it would remove most of one amino-acid family from a
# charging analysis. Candidates are now filtered by the arm first and uniqueness
# required of what survives.
#
# 0.18.0 fixed the reads table being written as ONE Arrow record batch however
# large it was — `read_batch_size` was declared, defaulted and never read, so
# `escpod filter` asking for 10,000 rows per batch wrote 40,000 reads as one.
# It is not cosmetic for anything that reads escpod's output back: `demux`
# shards its reader threads by batch index, so a single-batch file is decoded by
# exactly one thread and nothing reaches the GPU until the whole file is done.
# Every default is now 1,000, which is the geometry MinKNOW and the pod5 Python
# package already write.
#
# 0.17.2 made every command that takes POD5 input accept a DIRECTORY, and refuse
# a path that does not exist. Before it, `escpod demux basecall <run>/pod5`
# logged one WARN, wrote a header-only CSV and exited 0 — a result nothing
# downstream can distinguish from a run where no read passed. That matters here
# because `get_ldx_pod5_source` hands `classify` a directory and never a file:
# the resolver walks it RECURSIVELY, so a run split over pod5_pass and pod5_fail
# is covered by naming the run, which is what retired the per-run `escpod merge`.
#
# 0.17.1 remains a floor for two reasons of its own:
#   - it is the first release to ship a GPU BINARY
#     (`escpod-v<ver>-x86_64-unknown-linux-gnu-gpu.tar.gz`), so `ldx.gpu: true`
#     no longer needs a source build of the private repo. `pixi run setup`
#     downloads it alongside the musl default. See `ldx.gpu` below.
#   - `--device <auto|cpu|gpu>` replaces `--gpu`, which is now deprecated. The
#     rename carries a change in MEANING: `--device gpu` fails when the GPU is
#     unusable, where `--gpu` quietly continued on the CPU. That is the
#     behaviour we want — a silent CPU fallback on this path is a 20x slowdown
#     that looks like success — so demux.smk passes `--device` explicitly in
#     both directions rather than relying on the `auto` default.
#
# 0.17.0 DOES NOT EXIST as a download. Its GPU artifact failed to build, which
# skipped the release job, so it reached PyPI with no GitHub release and no
# binaries; upstream superseded rather than corrected it. Do not pin 0.17.0 —
# `pixi run setup` would 404.
#
# 0.13.0 is a correctness floor for the LDX path specifically, and is the one
# in this list that was silently wrong rather than merely absent. A `.p5s`
# sidecar's `(batch_idx, row_idx)` locators were dereferenced unchecked, so an
# index that passed the file-level identity guard but held wrong offsets
# returned a DIFFERENT REAL READ, correctly self-labelled. The signal paths
# were worse: they projected `read_id` and never read it, stamping the queried
# UUID onto whatever row they landed on. Nothing downstream could detect it.
# Every indexed lookup now confirms the row's `read_id` before using it. Our
# demux --annotate -> sidecar -> `classify` flow is exactly that path.
#
# 0.12.0 brought `--ref-scores`, which computes log P(barcode | signal) from the
# CRF lattice itself, so a demux call finally carries a continuous per-read
# confidence instead of only the edit-distance margin a designed panel pins to
# three values (escapepod-rs#241). See `ldx.ref_scores` below for what that buys
# and what it still does not.
#
# 0.12.0 is ALSO the floor for scoring on the sidecar path: it made `.p5s`
# columns numeric. Before it a sidecar held dictionary-encoded labels only, so
# a sidecar-only run computed crf_logp and then had nowhere to put it.
#
# Three earlier floors still hold, and are why this must not be moved backwards
# even for a run that does no charging classification:
#   - 0.9.0 added the `.p5s` sidecar and `demux --annotate`, which is what lets
#     the LDX path record barcode assignments beside the raw POD5 instead of
#     routing reads into per-barcode copies of it.
#   - 0.8.1 fixed a correctness bug, not a feature gap: escpod before it could
#     emit a POD5 whose signal batches break stride, which dorado then reads
#     SHORT — silently, no error, no non-zero exit. On the 2026-08-06 run that
#     cost 97,790 reads (10.6%) and looked like biology.
#   - 0.8.1 also carries the multi-input `filter` that `split_pod5` needs, and
#     the `boundary.margin` / `boundary.clamp_max_shift` bundle keys. No
#     upstream CRF bundle has ever actually declared either (see `ldx` below),
#     so the flags are what carry them; the escpod floor is for the flags.
escpod_version: 0.21.0

# modkit threshold parameters for modification calling
# optimized thresholds based on ModkitOpt (Sneddon et al. 2025)
# see https://github.com/comprna/modkitopt
# these params improve F1 by 51% (m6A) and 1251% (pseU) compared to defaults
modkit:
  # global threshold for canonical base confidence
  filter_threshold: 0.5
  # per-modification pass thresholds (mod code or ChEBI ID : threshold)
  #   a = N6-methyladenosine (m6A)
  #   m = 5-methylcytosine (m5C)
  #   17802 = pseudouridine (pseU)
  #   17596 = inosine
  mod_thresholds:
    a: 0.99
    m: 0.99
    "17802": 0.995
    "17596": 0.99

# Pairwise modification odds ratio parameters
odds_ratios:
  ml_threshold: 200     # CL tag threshold for charged classification
  min_coverage: 10      # minimum reads per tRNA/position pair

# additional options for particular commands
opts:
  # additional options for dorado basecalling
  # XXX place modified bases first as the arg parser gets confused
  # XXX add `-v` for verbose logging
  dorado: " --modified-bases m5C_2OmeC inosine_m6A_2OmeA pseU_2OmeU 2OmeG --emit-moves "

  # additional options for bwa alignment
  # based on Novoa lab optimising bwa for tRNA alignment
  # the -h 20 option is used to increase the number of secondary alignments reported in the XA tag
  bwa: " -W 13 -k 6 -T 20 -x ont2d"

  # requires positive strand alignment
  # requires at least 1 5' adapter base
  # requires 1 3' adapter base in the discriminating adapter region between charged and uncharged (edx01 adapters).
  bam_filter: "-5 24 -3 23 -s"

  # requires positive strand alignment and excludes non-primary alignments
  coverage: "--filterRNAstrand 'reverse' --samFlagExclude 256"

# WarpDemuX demultiplexing (optional, disabled by default)
#
# For Nano-tRNAseq data, use the WarpDemuX-tRNA models:
#   - WDX4_tRNA_rna004_v1_0 (Recommended) - barcodes: WDX_bc03, WDX_bc04, WDX_bc05, WDX_bc07
#   - WDX4b_tRNA_rna004_v1_0 - barcodes: WDX_bc04, WDX_bc05, WDX_bc07, WDX_bc11
#
# ATTENTION: WarpDemuX-tRNA models are developed for the Nano-tRNAseq protocol
# and do NOT work with data using the Thomas splint adapter.
#
# WDX4_tRNA_rna004_v1_0 has improved recovery (+3-7%) compared to WDX4b_tRNA_rna004_v1_0.
# QC report options
report:
  # path to a .qmd file to include at the end of the QC report (optional)
  custom_include: ""

# Optional QC steps
qc:
  # All-vs-all pairwise reference similarity. Identical sequences are always
  # collapsed before aligning, but the work is still quadratic in the number of
  # DISTINCT sequences.
  reference_similarity: true
  # Skip (with a warning) when the reference exceeds this many sequences. The
  # heatmap stops being legible in the low hundreds, and the dense square TSV
  # grows as n^2. Set to null to disable the guard. Ignored when
  # reference_similarity_max_mismatch is set, since collapsing bounds the
  # output size independently of the input size.
  reference_similarity_max_seqs: 2000
  # Additionally collapse sequences within this Hamming distance of a cluster
  # representative. 0 keeps only the lossless exact-duplicate collapse. Values
  # above 0 are lossy: the matrix is reported over representatives, with
  # membership recorded in reference_similarity.clusters.tsv. Hamming distance
  # requires equal lengths, so sequences differing by an indel never collapse.
  reference_similarity_max_mismatch: 0

# Reuse reference-independent outputs from a previous pipeline run.
# Set to the output_directory of a completed run to skip POD5 merging,
# basecalling, FASTQ extraction, and demultiplexing.
# Both runs must use the same samples/raw data — only reference can differ.
reuse_outputs_from: null

warpdemux:
  enabled: false
  barcode_kit: "WDX4_tRNA_rna004_v1_0"
  save_boundaries: true
  threads: 8

# LDX demultiplexing via escapepod's CTC-CRF barcode basecaller (optional).
#
# LDX names both the adapters and the barcode codes, `ldx01`..`ldx16`, and the
# shipped `barcode_crf_ldx16_rna004` bundle emits exactly those names -- so
# nothing is translated on this path. The retired `barcode_crf_nbc16_rna004`
# family called the same physical codes `nbcNN`; it is refused outright now
# (see get_ldx_model in demux.smk), because it is a different retrain rather
# than a renaming and its calls differ from ldx16's on ~8% of reads.
# This is the successor to the WarpDemuX/WDX path: it reads the barcode out of
# the raw adapter signal with a CRF and matches the decode to references by
# edit distance, rather than classifying boundary-gated fingerprints.
#
# Enable exactly one of `warpdemux.enabled` and `ldx.enabled` — they both
# populate the same per-sample `barcode` field and their rules write the same
# outputs. Assign barcodes with the `ldx:` key in the samples YAML.
#
# The model is a bundle DIRECTORY, not a file, and is self-describing: it
# carries its own barcode references and pins the boundary detector it was
# calibrated against, so no --barcodes and no --method are passed. Do not
# override the detector; LLR boundaries cost 17.2 points of balanced recall and
# fail silently.
ldx:
  enabled: false
  model: "resources/models/demux/barcode_crf_ldx16_rna004@v0.1.0"

  # --- Boundary gating -----------------------------------------------------
  # BOTH of the next two values are set HERE as well as, possibly, in the
  # bundle. escpod treats the flags as OVERRIDES, so what is written here wins;
  # setting them explicitly keeps the effective values visible and diffable
  # next to the measurements that justify them.
  #
  # Upstream bundles began declaring `boundary.margin` and
  # `boundary.clamp_max_shift` in escapepod-models#127/#128 (2026-09-06) —
  # `barcode_crf_wdx4_rna004@v0.2.1` and `barcode_crf_ldx32_rna004@v0.2.2` are
  # the first, both stating escpod's own fallbacks (200 / 0) so a run cannot
  # silently differ from them. Before that no bundle could: `build_crf_bundle.py`
  # cannot write the keys, so a bundle declaring one HAD been edited locally.
  # We did exactly that to nbc16 in #107 and #108; it broke that bundle's own
  # SHA256SUMS for eleven days and then read as evidence that a later release
  # had *removed* the keys.
  #
  # That heuristic is retired — `scripts/verify-demux-model.py` now records a
  # digest of each vendored bundle's sidecars instead, which catches the same
  # edit without forbidding legitimate upstream content. If a bundle declares
  # values that DIFFER from the ones below, the ones below are what runs.

  # Samples of adapter_end a read needs beyond the model's chunk (3000) before
  # the CRF will decode it; below that the read routes to `unclassified` with
  # confidence 0, undecoded. 200 is escpod's own fallback and the filter
  # `extract_chunks.py` applied to the training corpus, so no window the model
  # decodes reaches closer to the read's start than any it was trained on.
  #
  # This was 0 from 2026-08 to 2026-09 on the strength of "36,921 reads
  # recovered at median edit distance 0, 98.3% within 2 edits" (nbc16,
  # 2026-08-06 run). That metric cannot see a wrong call: a window with no
  # barcode in it still decodes to a PERFECT reference, whichever one the
  # degenerate signal sits nearest. Scored instead against an independent
  # label — the 5' index on the same molecule, ldx32 v0.2.1 over the
  # co-barcoded FDX Run1 (rnabioco/escapepod-rs#323) — the [3000, 3200) band
  # agrees with the design 55% of the time against 85% for reads with a full
  # window, and only reaches 84% under a lattice gate of 2.0 (at 56% of the
  # band). Under this file's gate of 1.0 it is 79% at 63%. That is ~1% of a
  # run at a precision ten points below the rest; a run config that raises
  # `min_crf_margin` to 2.0 may set this to 0 for that 1%. See
  # resources/models/demux/README.md.
  boundary_margin: 200

  # Decode a read whose adapter ends BEFORE the chunk from the window
  # [0, chunk], provided chunk - adapter_end is at most this. 0 disables it.
  # `boundary_margin` cannot reach these reads: their window would start before
  # sample 0, so there is nothing to relax. Clamping keeps the window width and
  # anchors it at the read start instead.
  #
  # Off. It was 300 on the same edit-distance evidence as above, plus "11 more
  # fixture reads" — and against the independent label the band it reaches
  # (adapter_end 2700-2999, 2% of a run) is 28% design-consistent with 45% of
  # its calls landing on codes absent from the pool; every larger shift is at
  # chance. Those reads are not truncated-but-callable, they are junk at both
  # ends (the 5' call degrades across the same bands). Turn it on per run only
  # from a measurement of that kind (rnabioco/escapepod-rs#323 has the
  # method: split the calls by adapter_end band, compare each band's EDX or
  # second-index concordance to the full-window band).
  clamp_max_shift: 0
  # Run the CRF encoder and boundary CNN on the GPU. Measured on the 2026-08-06
  # flowcell (1,001,307 reads, --ref-scores on), one GPU + 8 cores against the
  # released CPU binary on 32 cores:
  #
  #   CPU   ~2.6 h    108 reads/s   92.22% yield
  #   GPU   458.9 s  2,182 reads/s  92.22% yield    <- 20.3x, quarter the cores
  #
  # Identical yield; the stage trace shows the device saturated (workers busy
  # 94% of wall), so a second GPU would push further. The lattice decode stays
  # on the CPU regardless, so `threads` still matters.
  #
  # This needs the GPU BUILD of escpod, which since 0.17.1 ships as a release
  # artifact (`...-x86_64-unknown-linux-gnu-gpu.tar.gz`) and is downloaded by
  # `pixi run setup`; before that it required building the private repo from
  # source. `escapepod_demux` still resolves it out of
  # `resources/tools/escpod/<escpod_version>-gpu/` (see get_escpod_bin in
  # demux.smk) and fails loudly if it is missing — only the provenance changed,
  # not the path. `scripts/install-escpod-gpu.sh` remains for building an
  # unreleased ref, but is no longer on anyone's normal path.
  #
  # The GPU artifact is the one DYNAMICALLY linked build (glibc >= 2.28; RHEL 9
  # here is 2.34) because the CUDA runtimes are dlopened. It is x86_64 Linux
  # only, so `ldx.gpu: true` is unavailable on macOS and aarch64 regardless.
  # `escpod_version` is shared with the musl default — every other rule uses
  # that one — and both are installed under the same version string.
  #
  # Also needs a CUDA libonnxruntime on ORT_DYLIB_PATH (`pixi run
  # install-ort-gpu`) and cuDNN (`pixi install -e gpu`). Without cuDNN the CUDA
  # provider fails to register and onnxruntime falls back to the CPU with only a
  # warning — confirm the log says `CRF encoder: N worker(s) on GPU [0]`.
  #
  # Set false for a CPU-only host; the test configs do exactly that.
  gpu: true
  # Call a read unclassified when its edit-distance margin to the second-best
  # reference is below this. RETIRED to 0 in favour of the lattice gate below;
  # what follows is why it was 12, and why that stopped being the right value.
  #
  # The margin is quantised: on a 1,001,307-read RNA004 run, 99.0% of classified
  # reads sit at 12/13/14, because the 16 references are >=12 apart by design and
  # a WRONG decode lands just as cleanly on its reference as a right one. So the
  # residual error rate barely moves — which made 12 look useless until you asked
  # what it DISCARDS. Measured against a second, independently trained bundle
  # (disagreement between two models is a floor on error):
  #
  #   threshold  drops        of calls   of which disagreements
  #        1     1,295         0.14%          96.2%
  #       10     7,427         0.80%          91.3%
  #       12     8,817         0.95%          85.2%   <- the old default
  #       13   431,747        46.76%           8.5%   <- cliff, do not
  #
  # That was an 11:1 trade and the right one WHILE it was the only gate. Its
  # ceiling was always low: only ~1% of reads have a sub-plateau margin, so ~90%
  # of errors were out of its reach entirely.
  #
  # `min_crf_margin` below reaches them, and once it is on, 12 is not
  # complementary — it is redundant and then harmful. Re-measured on the same
  # run (2026-08-20, 923,431 calls, 77,618 cross-bundle disagreements), what
  # min_margin 12 removes ON TOP of the lattice gate:
  #
  #   crf gate   extra reads dropped   of which real errors
  #     0.5             1,157                 36.3%
  #     0.7               855                 19.2%
  #     1.0               728                  9.5%   <- at the shipped gate
  #     2.3               666                  3.5%
  #
  # At the shipped crf 1.0 it discards 728 reads that are 90.5% CORRECT and moves
  # total error removed by +0.09 points. The lattice gate's own discards are
  # ~85% real errors, so keeping 12 only lowers the average quality of what the
  # pipeline throws away.
  #
  # Raise it again only for a run with no lattice gate. Leave it 0 when the
  # measurement IS the crosstalk — gating removes the very reads such a run
  # exists to count.
  min_margin: 0

  # --- The lattice's own confidence ----------------------------------------
  # `--ref-scores` restricts the CRF forward recursion to the paths that emit a
  # given reference and normalises by the full partition function, which is a
  # real log P(barcode | signal):
  #
  #     crf_logp = logZ_target(reference) - logZ_full
  #
  # It adds four columns to classifications.csv — `crf_logp`, `crf_best` (the
  # reference the lattice itself prefers, which need not be the one edit
  # distance called), `crf_margin` (log-odds in nats against the runner-up) and
  # `mean_logpost`. That is resolution `confidence` does not have: over 20k
  # RNA004 reads `confidence` takes 15 distinct values with 98.7% of reads in
  # three of them, while `crf_margin` takes 14,818 over 16,747 reads.
  #
  # On by default, because it is exactly the audit record classifications.csv
  # is kept for, and it is cheap: +3.6% on the fused command. It costs MORE
  # under `gpu: true` — the constrained scan reads the raw scores, so the
  # decode returns to the host while the encoder stays on the device.
  ref_scores: true

  # Gates on that score. Below either threshold a read becomes `unclassified`
  # rather than a possibly-wrong assignment, and keeps its scores in the CSV so
  # the row still says which gate dropped it and by how much. Setting either
  # implies `--ref-scores`.
  #
  # Swept on the 2026-08-06 donor flowcell (1,001,307 reads; 923,431 calls at
  # margin 0), scoring precision against a second, independently trained bundle
  # exactly as the min_margin table above does — 77,618 of those calls are
  # cross-bundle disagreements, which is a floor on the error rate:
  #
  #   gate                 recall%   of all errors removed   discard precision%
  #   min_margin 12         91.34            9.52                  83.78
  #   min_crf_margin 0.5    89.53           29.87                  86.12
  #   min_crf_margin 0.7    88.74           38.59                  85.84
  #   min_crf_margin 1.0    87.85           47.69                  84.56   <- set
  #   min_crf_margin 2.3    85.59           64.48                  75.38
  #   min_crf_margin 4.6    80.18           77.71                  50.02
  #
  # 1.0 is where the dial stops being free. Its discards are 84.56% real errors
  # — the same quality as min_margin 12's 83.78% — while removing 47.69% of all
  # error against that gate's 9.52%: five times the error for the same discard
  # precision, costing 3.5 points of recall. Past ~1.3 discard precision decays,
  # and by 4.6 half of what is dropped is correct, which is yield burnt for
  # nothing.
  #
  # Measured on the GPU (onnxruntime) encoder, unlike the CPU-measured
  # min_margin table above. Calls agree with the CPU (tract) encoder on 99.76%
  # of fixture reads and crf_margin differs at a median of 0.0016 nats, so the
  # threshold is not sensitive to that difference — but it is the reason the two
  # tables are not strictly one measurement.
  #
  #   min_crf_margin — nats of log-odds for the CALLED barcode against its best
  #     alternative. Continuous, and negative when the lattice prefers a
  #     different reference, so any positive threshold rejects both the
  #     ambiguous reads and the ones the lattice actively disagrees with. On
  #     this run 9,617 of 9,618 such reads have a negative margin, and 87.9% of
  #     them are genuine cross-bundle disagreements.
  #     0.7 nats is 2:1 odds, 2.3 is 10:1, 4.6 is 100:1.
  #   min_crf_prob — P(called barcode | signal) in absolute terms. A different
  #     cut, not a rescaling of the same one: a read can be sure it is none of
  #     the other 15 barcodes and still put little mass on any reference at all.
  #     Left unset; the margin gate is the one that was swept.
  min_crf_margin: 1.0
  min_crf_prob: null

  threads: 16

# FDX: the 5' index, demultiplexed as a SECOND AXIS of the escpod path.
#
# An FDX library carries two barcodes on every molecule: the 3' LDX code above,
# read off the adapter boundary, and a 27-nt 5' code inside a 77-nt DNA adapter
# (poly(C) leader + code + A6 spacer + the 23-nt arm the reference already
# carries), read off the READ END -- RNA004 translocates 3'->5', so the 5'
# adapter is simply where the signal stops. The shipped 4-code bundle anchors
# its window there and consumes no boundary detector.
#
# It is a second axis, not a replacement: a sample is `{ldx: ldx01, fdx: fdx01}`
# and owns the reads on which BOTH calls agree. `fdx.enabled` therefore needs
# `ldx.enabled`, and the read-level accounting (demux_summary, read_attrition)
# stays keyed on the LDX pass.
#
# One pass or two. escpod can call both models in ONE sweep of the POD5
# (`escpod demux --model ldx=... --model fdx=...`), decoding each read's signal
# once, and that is the shape to want on a 600 GB flowcell where the sweep is
# hours of IO-bound wall. `fused: true` selects it. It is OFF by default
# because escpod -- 0.19.0 and 0.20.0, both measured -- applied
# `--boundary-margin` / `--clamp-max-shift` to every model of the run and
# REFUSED them outright when any model anchored on the read end, which the fdx
# bundle does:
#
#   Error: --boundary-margin is not applicable: this model anchors its window
#   on the read end, so no boundary margin or window shift is involved.
#
# The LDX axis cannot give those flags up (they are what keeps the window rules
# explicit and diffable; the "~14% recovered" figure that used to appear here
# rested on the edit-distance evidence #155 retired -- a window holding no
# barcode still decodes to a PERFECT reference, so edit distance cannot see a
# wrong call). So `fused: false` runs the FDX axis as a second pass over the raw
# POD5 (escapepod_demux_fdx) and select_demux_reads.py joins the two CSVs per
# read.
#
# FIXED IN escpod 0.21.0 (escapepod-rs#323), which is what this pins: the flags
# are now scoped to the heads that have a boundary detector, read-end heads
# ignore them and are named as doing so, and only a run with read-end models
# ALONE is refused. So `fused: true` is now legal. It stays off by default
# because nothing in this project has measured the fused path end to end --
# flipping it is a throughput change to make deliberately, with a run to
# compare against. Nothing downstream changes -- the join reads either shape.
#
# The join also applies each axis's lattice gate itself (`--gate ldx=…
# --gate fdx=…`), because a fused pass has one `--min-crf-margin` for every
# model and the two axes want different operating points. In the two-pass
# shape escpod has already applied each gate and the join's re-application is a
# no-op; in the fused shape the join is where the FDX gate happens.
#
# Sidecar: the LDX pass, unnamed, annotates `barcode`; the FDX pass annotates
# `fdx`; a fused pass annotates `ldx` and `fdx`. The lattice columns (`crf_*`)
# are shared between two passes and belong to whichever ran last -- the FDX
# pass is ordered after the LDX one so the two writes cannot race. The per-axis
# classifications CSVs are the record the pipeline reads.
fdx:
  enabled: false
  model: "resources/models/demux/barcode_crf_fdx4_rna004@v0.2.0"
  fused: false

  # The lattice gate for this axis, in nats. 3.5 is the operating point the
  # bundle itself declares (metadata `gate.min_crf_margin`, calibrated on 4,000
  # reads: yield 0.964, precision 0.977), and it is LOAD-BEARING in a way the
  # LDX gate is not. A CRF snaps a read that carries none of its codes onto the
  # nearest one at a normal edit-distance margin, so a read without an FDX
  # adapter is not refused, it is confidently mis-assigned -- and the ldx gate
  # of 1.0 would let most of those through. Measured on the 415-read LDX fixture,
  # whose reads carry NO 5' index: at 1.0 nats 69 reads (17%) are still called
  # an fdx code; at 3.5, 9 (2.2%). Reads below the gate are `unclassified` on
  # this axis, and so drop out of every dual-index sample.
  min_crf_margin: 3.5
  min_crf_prob: null

# EDX (3' adapter barcode) handling.
#
# Two independent things live here, and they are deliberately separable:
#
#   1. FILTERING. Driven per-sample by the `edx:` key in the samples YAML. A
#      sample with `edx: edx01` keeps only its own adapter's reads, so one
#      library pooled across adapters becomes one sample per adapter.
#
#   2. CONCORDANCE. `enabled: true` emits summary/edx/edx_concordance.tsv.gz,
#      the signal-barcode x 3'-adapter contingency table.
#
# `detect_all` decouples them: it runs adapter detection on every sample rather
# than only those carrying an `edx:` assignment. That is what an adapter-ligation
# QC run needs — each signal barcode legitimately holds a MIXTURE of 3' adapters,
# so there is no single adapter to filter to, but the full cross-tabulation is
# precisely the measurement.
edx:
  enabled: false
  detect_all: false
  # Minimum margin between the best and second-best 3' adapter alignment score
  # for a read's adapter call to be counted as CLEAN in the concordance table.
  # Reads below it are still reported, under `ambiguous`. 0 disables the gate.
  # Crosstalk measured without a margin gate is inflated by near-ties, which is
  # why the upstream barcode training corpus gated on margin > 5.
  min_margin: 5
