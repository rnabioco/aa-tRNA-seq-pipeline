# Ruff configuration for aa-tRNA-seq-pipeline.
#
# The rule set is declared EXPLICITLY rather than inherited from ruff's
# defaults. Those defaults are not a stable contract: ruff 0.16 widened them and
# took `ruff check` from clean to 49 findings on code that had not changed.
# `lint-python` gates CI, so an implicit rule set means a ruff release can turn a
# green main red on its own.
#
# Widening this list is a deliberate change: run
# `ruff check workflow/scripts/ --select <RULE>` first and clear the findings in
# the same commit that adds the rule. `ruff = "0.16.*"` in pixi.toml holds the
# formatter and the rule definitions steady between such changes.

# The oldest interpreter the pipeline supports (`python = ">=3.10"`). Without
# this ruff infers a target from the environment, so a rule like B905's
# `zip(strict=)` fix could suggest syntax that is invalid on 3.10.
target-version = "py310"

[lint]
select = [
  "E4",   # pycodestyle: imports
  "E7",   # pycodestyle: statements
  "E9",   # pycodestyle: syntax/IO errors
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "SIM",  # flake8-simplify
  "FURB", # refurb
  "C4",   # flake8-comprehensions
  "BLE",  # flake8-blind-except
  "EXE",  # flake8-executable
  "RUF",  # ruff-specific
]
