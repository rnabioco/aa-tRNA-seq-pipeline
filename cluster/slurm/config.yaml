# Snakemake Slurm Executor Profile Configuration
# ================================================
# Usage: snakemake --profile cluster/slurm
#
# Customize slurm_partition, slurm_account, and slurm-logdir for your cluster

executor: slurm
jobs: 100
latency-wait: 60

rerun-incomplete: true
keep-going: true
printshellcmds: true
show-failed-logs: true

# Slurm-specific settings
slurm-logdir: "logs/slurm"
slurm-keep-successful-logs: false
slurm-delete-logfiles-older-than: 10
slurm-qos: normal

# Default resources (CPU)
default-resources:
  slurm_partition: rna
  slurm_account: rbi
  runtime: "2h"
  mem_mb: 8000
  cpus_per_task: 1

# Rule-specific resource overrides
set-resources:
  # GPU-accelerated rules
  rebasecall:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    gres: "gpu:1"
    runtime: "16h"
    mem_mb: 48000
    cpus_per_task: 4

  classify_aa:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    gres: "gpu:1"
    runtime: "8h"
    mem_mb: 48000
    cpus_per_task: 4

  classify_charging:
    runtime: "4h"
    mem_mb: 24000
    cpus_per_task: 4

  classify_charging_leech:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    gres: "gpu:1"
    runtime: "2h"
    mem_mb: 24000
    cpus_per_task: 4

  classify_aa_identity:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    gres: "gpu:1"
    runtime: "6h"
    mem_mb: 32000
    cpus_per_task: 4

  # Tag transfer rules
  inject_ubam_tags:
    runtime: "6h"
    mem_mb: 48000
    cpus_per_task: 4

  transfer_bam_tags:
    cpus_per_task: 4

  # CPU-intensive rules
  bwa_align:
    runtime: "12h"
    mem_mb: 96000
    cpus_per_task: 16

  remora_signal_stats:
    runtime: "3h"
    mem_mb: 24000
    cpus_per_task: 4

  modkit_extract_calls:
    runtime: "6h"
    mem_mb: 48000
    cpus_per_task: 4

  modkit_extract_full:
    runtime: "6h"
    mem_mb: 48000
    cpus_per_task: 4

  # WarpDemuX rules
  warpdemux:
    runtime: "6h"
    mem_mb: 32000
    cpus_per_task: 16

  parse_warpdemux:
    runtime: "1h"
    mem_mb: 8000
    cpus_per_task: 1

  compute_odds_ratios:
    mem_mb: 16000
