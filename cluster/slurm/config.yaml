# Snakemake Slurm Executor Profile Configuration
# ================================================
# Usage: snakemake --profile cluster/slurm
#
# Customize slurm_partition, slurm_account, and slurm-logdir for your cluster

executor: slurm
jobs: 100
latency-wait: 60

rerun-incomplete: true
keep-going: true
printshellcmds: true
show-failed-logs: true

# Slurm-specific settings
slurm-logdir: "logs/slurm"
slurm-keep-successful-logs: false
slurm-delete-logfiles-older-than: 10
# NOTE: no profile-wide slurm-qos here. The executor plugin appends
# settings.slurm-qos *after* any per-rule `qos` resource, so a global
# value here silently overrides (or, if passed via slurm_extra, is
# outright rejected by) per-rule QOS overrides like rebasecall's
# gpu_long. Rules without an explicit `qos` resource just get the
# partition's default QOS.

# Default resources (CPU)
default-resources:
  slurm_partition: rna
  slurm_account: rbi
  runtime: "2h"
  mem_mb: 8000
  cpus_per_task: 1

# Rule-specific resource overrides
set-resources:
  # GPU-accelerated rules
  rebasecall:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    gres: "gpu:1"
    runtime: "16h"
    mem_mb: 48000
    cpus_per_task: 4

  # CPU only: escpod signal classify has no GPU path
  classify_charging:
    runtime: "4h"
    mem_mb: 24000
    cpus_per_task: 8

  # Tag transfer rules
  inject_ubam_tags:
    runtime: "6h"
    mem_mb: 48000
    cpus_per_task: 4

  # CPU-intensive rules
  bwa_align:
    runtime: "12h"
    mem_mb: 96000
    cpus_per_task: 16

  modkit_extract_calls:
    runtime: "6h"
    mem_mb: 48000
    cpus_per_task: 4

  modkit_extract_full:
    runtime: "6h"
    mem_mb: 48000
    cpus_per_task: 4

  # WarpDemuX rules
  split_pod5:
    runtime: "4h"
    mem_mb: 32000
    cpus_per_task: 2

  warpdemux:
    runtime: "6h"
    mem_mb: 32000
    cpus_per_task: 16

  parse_warpdemux:
    runtime: "1h"
    mem_mb: 8000
    cpus_per_task: 1

  # escapepod (LDX) demux rules
  #
  # The released escpod binary has no CUDA execution provider, so the CRF
  # encoder runs on the CPU and this rule is compute-bound on cores rather
  # than being a GPU job. Measured on 20k RNA004 reads: 59 ms of CPU per read
  # for detect + encode + decode. A single 561k-read POD5 is therefore ~9
  # CPU-hours, which is ~20 min at 32 cores and most of a day at 1.
  #
  # Memory scales with the number of barcodes, not the input: the router keeps
  # a bounded pool of queued reads per barcode writer.
  # GPU: the fused pipeline runs boundary detection through onnxruntime's CUDA
  # provider when given `--method cnn --gpu`. The method has to be passed
  # EXPLICITLY — a detector merely pinned by the model bundle leaves detection
  # on the CPU and makes --gpu inert (escpod warns "--gpu has no effect here").
  #
  # The CRF encoder itself stays on the CPU in the fused path regardless, so
  # cpus_per_task stays high to feed it: POD5 decode, signal prep, the encoder
  # and the lattice decode all run CPU-side while the GPU does detection.
  #
  # Needs an escpod built with crf-gpu/cnn-gpu (`pixi run install-escpod-gpu`)
  # plus the CUDA onnxruntime (`pixi run install-ort-gpu`); the stock release
  # binary rejects --gpu. With the stock binary, drop the gpu lines and set
  # ldx.gpu false.
  escapepod_demux:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    gres: "gpu:1"
    runtime: "8h"
    mem_mb: 48000
    cpus_per_task: 16

  link_ldx_pod5:
    runtime: "10m"
    mem_mb: 2000
    cpus_per_task: 1

  compute_odds_ratios:
    mem_mb: 16000
