# Snakemake Slurm Executor Profile Configuration
# ================================================
# Usage: snakemake --profile cluster/slurm
#
# Customize slurm_partition, slurm_account, and slurm-logdir for your cluster

executor: slurm
jobs: 100
latency-wait: 60

rerun-incomplete: true
keep-going: true
printshellcmds: true
show-failed-logs: true

# Slurm-specific settings
slurm-logdir: "logs/slurm"
slurm-keep-successful-logs: false
slurm-delete-logfiles-older-than: 10
# NOTE: no profile-wide slurm-qos here. The executor plugin appends
# settings.slurm-qos *after* any per-rule `qos` resource, so a global
# value here silently overrides (or, if passed via slurm_extra, is
# outright rejected by) per-rule QOS overrides like rebasecall's
# gpu_long. Rules without an explicit `qos` resource just get the
# partition's default QOS.

# Default resources (CPU)
default-resources:
  slurm_partition: rna
  slurm_account: rbi
  runtime: "2h"
  mem_mb: 8000
  cpus_per_task: 1

# Rule-specific resource overrides
set-resources:
  # GPU-accelerated rules
  rebasecall:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    gres: "gpu:1"
    runtime: "16h"
    mem_mb: 48000
    cpus_per_task: 4

  # CPU only: escpod signal classify has no GPU path
  classify_charging:
    runtime: "4h"
    mem_mb: 24000
    cpus_per_task: 8

  # Tag transfer rules
  inject_ubam_tags:
    runtime: "6h"
    mem_mb: 48000
    cpus_per_task: 4

  # CPU-intensive rules
  bwa_align:
    runtime: "12h"
    mem_mb: 96000
    cpus_per_task: 16

  modkit_extract_calls:
    runtime: "6h"
    mem_mb: 48000
    cpus_per_task: 4

  modkit_extract_full:
    runtime: "6h"
    mem_mb: 48000
    cpus_per_task: 4

  # WarpDemuX rules
  split_pod5:
    runtime: "4h"
    mem_mb: 32000
    cpus_per_task: 2

  warpdemux:
    runtime: "6h"
    mem_mb: 32000
    cpus_per_task: 16

  parse_warpdemux:
    runtime: "1h"
    mem_mb: 8000
    cpus_per_task: 1

  # escapepod (LDX) demux rules
  #
  # The released escpod binary has no CUDA execution provider, so the CRF
  # encoder runs on the CPU and this rule is compute-bound on cores rather
  # than being a GPU job. Measured on 20k RNA004 reads: 59 ms of CPU per read
  # for detect + encode + decode. A single 561k-read POD5 is therefore ~9
  # CPU-hours, which is ~20 min at 32 cores and most of a day at 1.
  #
  # Memory scales with the number of barcodes, not the input: the router keeps
  # a bounded pool of queued reads per barcode writer.
  # GPU: the fused pipeline runs boundary detection AND the CTC-CRF encoder
  # through onnxruntime's CUDA provider when given `--device gpu --method cnn`.
  # Confirmed on an A30: `CRF encoder: N worker(s) on GPU [0]`.
  #
  # `--device gpu` replaced `--gpu` in escapepod-rs 0.17.1, and is a
  # REQUIREMENT rather than a preference: it fails when no device is visible or
  # onnxruntime cannot register its CUDA provider, where `--gpu` quietly
  # continued on the CPU. That is deliberate — the silent fallback is a 20x
  # slowdown that still produces correct output.
  #
  # The LATTICE DECODE stays on the CPU regardless, so cpus_per_task stays high
  # to feed the device: POD5 decode, signal prep and the decode all run
  # CPU-side.
  #
  # Needs the GPU build of escpod, which `pixi run setup` downloads since
  # 0.17.1 (it was a source build before), plus the CUDA onnxruntime
  # (`pixi run install-ort-gpu`) and cuDNN (`pixi install -e gpu`). On a host
  # without a GPU, drop the gpu lines here and set ldx.gpu false.
  escapepod_demux:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    gres: "gpu:1"
    # 12h, not 8. Like rebasecall_ldx_run below this rule has NO RESUME -- it is
    # one `escpod demux` writing its sidecars and --classifications in a single
    # pass, so a job killed on wall clock loses the whole thing rather than a
    # tail of it. Measured 2026-08-26 on 4x A30 (one device; escpod is
    # single-GPU): 422 GB of POD5 in 283 min = 1.49 GB/min, INCLUDING the ~50
    # onnxruntime arena OOM retries that run hit. The complete 2026-08-21 Watt
    # pus4 flowcell is 559 GB, so ~375 min -- which left the old 8h just 105 min
    # of margin on a 6.2h job, from a single measurement. Overrunning destroys
    # ~6 h of GPU; asking for more only risks not starting, and only when a
    # maintenance reservation is pending. Check `scontrol show reservation`
    # before trusting a number this large.
    runtime: "12h"
    mem_mb: 48000
    # escpod is SINGLE-GPU: `--device` takes auto|cpu|gpu with no index or
    # count, and the encoder logs `worker(s) on GPU [0]`. gres above stays 1 --
    # asking for more allocates devices it cannot address. The only lever here
    # is threads, and the GPU is ~94% of wall, so it is worth a few percent.
    # 32 to match `ldx.threads` in the project config; at 16 this silently
    # halved what the config asked for, since cpus_per_task overrides `threads`.
    cpus_per_task: 32

  # The LDX run basecall. Same work as `rebasecall`, gathered into one job
  # instead of one per sample, so it needs a runtime that covers the whole
  # flowcell rather than a barcode's share of it.
  #
  # THERE IS NO RESUME. This rule is a plain `dorado basecaller ... >{output}`;
  # nothing passes --resume-from, and the output is a shell redirect, so a job
  # killed on wall clock loses the entire basecall rather than a tail of it.
  # Size `runtime` to finish, not to be generous -- and when a maintenance
  # reservation is pending, remember Slurm will not START a job whose walltime
  # crosses into it, so an over-large request means the job simply never runs.
  #
  # dorado is not pinned to a device (`opts.dorado` passes no -x), so it uses
  # every visible GPU and scales across all four on a node. Measured here on
  # 2026-08-26, 4x A30, rna004_130bps_sup@v5.3.0 with the four mod models:
  # 928,690 reads in 569 s = 1,632 reads/s wall (1,789 steady, the difference
  # being dorado's batch-size benchmarking at startup). The 2026-08-21 Watt
  # pus4 flowcell is 27.7M reads, ~92% of which demux assigns, so ~25.5M reads
  # => ~4.3 h (260 min).
  #
  # 4h45 rather than a round 5h, and the asymmetry is the reason. Overrunning
  # the walltime destroys the whole basecall, since there is no resume; failing
  # to START only costs the attempt, because demux's output is already on disk.
  # So margin belongs on the job, not on the deadline: 285 min is 25 min over
  # the measured need, and still lets Slurm start it as late as 01:15 against
  # the 06:00 reservation. Re-derive this against the next reservation rather
  # than inheriting it -- it encodes a date, not a property of the data.
  rebasecall_ldx_run:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    gres: "gpu:4"
    runtime: "285m"   # 4h45 -- see note above
    # 192 GB, and DO NOT TRIM THIS ON THE BENCHMARK. A single-POD5 `dorado
    # basecaller` run peaks around 16 GiB, which makes any number here look
    # absurd -- but that benchmark passes no --read-ids and reads one file.
    # This rule runs --recursive across every POD5 of a run while filtering a
    # read-id set, and its host memory CLIMBS THROUGHOUT: measured 2026-08-29
    # on the Watt pus4 flowcell (72 POD5, 4,889,538 of 32,541,382 reads kept),
    # RSS was 81 GiB half an hour in and 124.9 GiB at the end -- against a
    # 125 GiB request. It completed with roughly 130 MB to spare, which is not
    # a margin, it is luck.
    #
    # So the old 128000 was accidentally almost right and is now raised, not
    # lowered. It scales with the reads kept, so a bigger sample set needs
    # more again; re-measure with `sacct -j <id>.0 --format=MaxRSS` rather than
    # assuming this covers it. There is no resume, so an OOM kill costs the
    # whole basecall -- the same asymmetry as the walltime above. compgpu
    # nodes have 251 GB, so 192 still co-schedules.
    mem_mb: 192000
    cpus_per_task: 32

  ldx_split_parent_map:
    runtime: "2h"
    mem_mb: 8000
    cpus_per_task: 4

  extract_ldx_sample_reads:
    runtime: "1h"
    mem_mb: 16000
    cpus_per_task: 1

  split_ldx_ubam:
    runtime: "4h"
    mem_mb: 8000
    cpus_per_task: 4

  merge_run_pods:
    runtime: "4h"
    mem_mb: 16000
    cpus_per_task: 12

  compute_odds_ratios:
    mem_mb: 16000
