# Snakemake Slurm Executor Profile Configuration
# ================================================
# Usage: snakemake --profile cluster/slurm
#
# Customize slurm_partition, slurm_account, and slurm-logdir for your cluster

executor: slurm
jobs: 100
latency-wait: 60

# Global resource ceilings, counted across every running job.
#
# `jobs: 100` bounds the job COUNT and nothing else, so a rule whose cost is a
# shared filesystem rather than a core can still fan out until that filesystem
# is the bottleneck. `pod5_readers` is that bound for the rules that sweep a
# POD5 store: each declares `pod5_readers=1`, so at most eight of them page one
# at a time.
#
# Sized 2026-09-06 from the contrast between production runs -- 5-6 concurrent
# classify jobs gave 1436-1809 us/read, 34-36 gave 3300-3603, on the same escpod
# version and the same model bundle. Eight is inside the fast band with margin;
# it is not itself a measured optimum, and the 1/4/8/16/32-way curve has not
# been run. Raise it if the cluster is idle and classify is not I/O-starved.
resources:
  - pod5_readers=8

rerun-incomplete: true
keep-going: true
printshellcmds: true
show-failed-logs: true

# Slurm-specific settings
slurm-logdir: "logs/slurm"
slurm-keep-successful-logs: false
slurm-delete-logfiles-older-than: 10

# Poll job state with squeue rather than Snakemake's default sacct.
#
# Without this the executor's status check depends on slurmdbd being reachable,
# and when it is not the controller does not error -- it silently stops making
# progress after its first submission batch. That is what a controller driven
# from inside an allocation (a compute-node interactive session) hits, and the
# failure looks like a hung pipeline rather than a configuration problem.
#
# squeue only reports live jobs, so a job that finishes between polls reads as
# gone; the executor handles that and falls back for the final state.
slurm-status-command: squeue
# NOTE: no profile-wide slurm-qos here. The executor plugin appends
# settings.slurm-qos *after* any per-rule `qos` resource, so a global
# value here silently overrides (or, if passed via slurm_extra, is
# outright rejected by) per-rule QOS overrides like rebasecall's
# gpu_long. Rules without an explicit `qos` resource just get the
# partition's default QOS.

# Default resources (CPU)
#
# No cpus_per_task here, deliberately. The slurm executor plugin uses
# `cpus_per_task` when the resource is set and falls back to a rule's
# `threads:` only when it is not (snakemake_executor_plugin_slurm/partitions.py,
# get_cpu_setting) -- so a default of 1 clamped every rule without an explicit
# set-resources entry to a single core, whatever it declared. bam_to_coverage
# ran `bamCoverage -p 4` on one CPU, compute_reference_similarity likewise, and
# every `samtools -@` in a pipe was oversubscribed. Rules that need more than
# `threads:` says still get it from set-resources below.
default-resources:
  slurm_partition: rna
  slurm_account: rbi
  runtime: "2h"
  mem_mb: 8000

# Rule-specific resource overrides
set-resources:
  # GPU-accelerated rules
  rebasecall:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    gres: "gpu:1"
    runtime: "16h"
    mem_mb: 48000
    cpus_per_task: 4

  # mem_mb/runtime only -- slurm_partition/slurm_account/gres/cpus_per_task
  # are NOT set here. `charging.gpu` (config/config-base.yml) toggles this
  # rule between the CPU (default) and GPU windowed-TCN scorer, and this
  # static profile has no way to see that pipeline-config value, so the rule
  # declares those itself (aatrnaseq-process.smk) and they win over anything
  # unset here. mem_mb/runtime stay CPU-sized and unmeasured for the GPU path
  # -- a safe ceiling, not a GPU-specific budget; revisit once profiled.
  #
  # runtime and mem_mb both carried no headroom and both are read-count-driven,
  # which is the wrong shape for a corpus that keeps growing. Measured on the
  # 2026-09-04 results_v05 jobs: MaxRSS 23.31 G against the old 24000 (97% of
  # the request), and 258380 ran 3:48:45 of the old 4h, with 263197 already
  # TIMEOUT at 4:00:13. The `_b4` samples are the largest yet -- LysRS_U_all20_b4
  # alone is 3.88M scored reads, 2h17m of classify plus 4.5m of BAM write.
  #
  # cpus_per_task moved out 2026-09-08, mem_mb moved out 2026-09-11: both
  # used to be flat here, but both are now GPU-conditional (see
  # aatrnaseq-process.smk) and this static profile has no way to see
  # `charging.gpu` either, same reason slurm_partition/gres never lived here.
  classify_charging:
    runtime: "8h"

  # CPU-intensive rules
  bwa_align:
    runtime: "12h"
    # 160 GB. Unlike rebasecall_ldx_run below, this number IS a requirement:
    # bwa does not expand to the cgroup limit. MUT_rep1 used 78.6 of the
    # 93.75 GiB available and stopped there, so MaxRSS here is a real
    # measurement rather than a reflection of the budget.
    #
    # What drives it is `bwa mem -k 6` on a small, dense reference: a 6-mer
    # recurs ~55 times in the 1246-record danRer11 build, so seed chaining
    # dominates. `samtools sort -m 2G -@ 4` is only 8 GB of the total.
    # Measured 2026-08-29 on the Watt pus4 flowcell, and note the ORDER:
    #
    #     633,582 reads   78.6 GiB   completed
    #   1,429,498 reads   90.1 GiB   OOM-KILLED at 96000
    #   1,937,960 reads   87.2 GiB   completed
    #
    # The DEEPEST sample used less than the one that died, so this does not
    # scale with read count and cannot be sized from it. The usage sits in a
    # 78-90 GiB band whose position within it is not explained by depth --
    # most likely a few reads with pathological seed fan-out, which is a
    # property of the sequences, not of how many there are. Treat 96000 as
    # inside the noise rather than as a limit that was merely a little too low.
    #
    # 160000 is roughly 1.8x the top of the observed band. It is chosen for
    # margin against variance, not against a trend, and still co-schedules on
    # a 251 GB node.
    #
    # Memory also scales with `-t`, so cutting cpus_per_task is the other lever
    # if a future reference is denser still. Raising max_mismatch in the project
    # config is a third: it shrinks the reference and with it the 6-mer hit
    # density that causes this.
    #
    # Since v0.7 this rule also carries dorado's tags through `bwa mem -C`
    # (retiring inject_ubam_tags and its 48 GB). The FASTQ comment is ~13x the
    # read, and bwa holds one batch of input plus output in memory; the rule
    # pins the batch with `-K 100000000`, which bounds that at a few GB and is
    # inside the margin above. Re-measure MaxRSS on the first full flowcell
    # through this path before trusting the number further.
    mem_mb: 160000
    cpus_per_task: 16

  # No mem_mb for either modkit_extract rule: it scales with the input BAM
  # (34-39 GB per GB, measured 2026-09-14) and a static number here would
  # override the input-sized one the rules declare (aatrnaseq-modifications.smk).
  # The flat 48000 this replaces OOM-killed every BAM above ~1.3 GB.
  modkit_extract_calls:
    runtime: "6h"
    cpus_per_task: 4

  modkit_extract_full:
    runtime: "6h"
    cpus_per_task: 4

  # WarpDemuX rules
  split_pod5:
    runtime: "4h"
    mem_mb: 32000
    cpus_per_task: 2

  warpdemux:
    runtime: "6h"
    mem_mb: 32000
    cpus_per_task: 16

  parse_warpdemux:
    runtime: "1h"
    mem_mb: 8000
    cpus_per_task: 1

  # escapepod (LDX) demux rules
  #
  # The released escpod binary has no CUDA execution provider, so the CRF
  # encoder runs on the CPU and this rule is compute-bound on cores rather
  # than being a GPU job. Measured on 20k RNA004 reads: 59 ms of CPU per read
  # for detect + encode + decode. A single 561k-read POD5 is therefore ~9
  # CPU-hours, which is ~20 min at 32 cores and most of a day at 1.
  #
  # Memory scales with the number of barcodes, not the input: the router keeps
  # a bounded pool of queued reads per barcode writer.
  # GPU: the fused pipeline runs boundary detection AND the CTC-CRF encoder
  # through onnxruntime's CUDA provider when given `--device gpu --method cnn`.
  # Confirmed on an A30: `CRF encoder: N worker(s) on GPU [0]`.
  #
  # `--device gpu` replaced `--gpu` in escapepod-rs 0.17.1, and is a
  # REQUIREMENT rather than a preference: it fails when no device is visible or
  # onnxruntime cannot register its CUDA provider, where `--gpu` quietly
  # continued on the CPU. That is deliberate — the silent fallback is a 20x
  # slowdown that still produces correct output.
  #
  # The LATTICE DECODE stays on the CPU regardless, so cpus_per_task stays high
  # to feed the device: POD5 decode, signal prep and the decode all run
  # CPU-side.
  #
  # Needs the GPU build of escpod, which `pixi run setup` downloads since
  # 0.17.1 (it was a source build before), plus the CUDA onnxruntime
  # (`pixi run install-ort-gpu`) and cuDNN (`pixi install -e gpu`). On a host
  # without a GPU, drop the gpu lines here and set ldx.gpu false.
  escapepod_demux:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    # 2 GPUs. Through escpod 0.17.x this was correctly 1: `--device` took only
    # auto|cpu|gpu, with no index or count, and the encoder logged
    # `worker(s) on GPU [0]`, so a second device would be allocated and left
    # idle. That is no longer the constraint -- raised on the author's word that
    # two are usable. If a run still logs a single device, put this back to 1
    # rather than holding a GPU nothing addresses.
    gres: "gpu:2"
    # 12h, not 8. This rule has NO RESUME -- it is one `escpod demux` writing
    # its sidecars and --classifications in a single pass, so a job killed on
    # wall clock loses the whole thing rather than a tail of it. (rebasecall and
    # rebasecall_ldx_run no longer share that: they resume, see below. escpod
    # has no equivalent of dorado's --resume-from, so this one still does not.)
    # Measured 2026-08-26 on 4x A30 (one device; escpod is
    # single-GPU): 422 GB of POD5 in 283 min = 1.49 GB/min, INCLUDING the ~50
    # onnxruntime arena OOM retries that run hit. The complete 2026-08-21 Watt
    # pus4 flowcell is 559 GB, so ~375 min -- which left the old 8h just 105 min
    # of margin on a 6.2h job, from a single measurement. Overrunning destroys
    # ~6 h of GPU; asking for more only risks not starting, and only when a
    # maintenance reservation is pending. Check `scontrol show reservation`
    # before trusting a number this large.
    #
    # The 2026-08-29 rerun then did 559 GB / 32.5M reads in 3h22 -- 1.65x the
    # reads per minute of the 4h43 run, on an IDENTICAL allocation: same node,
    # 32 cpu, 1 GPU, same escpod 0.17.1. The cause is NOT established. It is not
    # the thread count and not the version, and the faster run had more
    # competing GPU work, not less; warm page cache on the re-read POD5 is the
    # obvious candidate and is untested. Keep the headroom until the throughput
    # is understood, rather than sizing to the good run.
    runtime: "12h"
    # 48000, and DO NOT CUT IT on a MaxRSS argument. This was tried on
    # 2026-09-04 and killed two flowcells.
    #
    # The reasoning that justified the cut was: escpod peaks at 99.7% of
    # whatever cgroup it is given (46.7 of 46.9 GiB), which is the same
    # arena-fills-the-cgroup signature this file documents for dorado below, so
    # MaxRSS cannot state a requirement; and memory was not the binding
    # constraint for packing (2 jobs/node by CPU and by GPU, 5 by memory). Both
    # premises are true. The conclusion does not follow.
    #
    # At 24000, ten demux jobs ran and TWO were cgroup-OOM-killed:
    #   20260227 Pool1 (760 GB)  OUT_OF_MEMORY 0:125 after 2h02
    #   20260306 Pool2 (486 GB)  OUT_OF_MEMORY 0:125 after 1h38
    # and the eight that SURVIVED each peaked at 24.44 GB. Every job, living or
    # dead, sat hard against the limit -- which is what an arena grown to the
    # cgroup implies: the limit becomes the working set, so lowering it does not
    # reclaim slack, it moves the cliff. Packing was never what would kill it.
    #
    # 530 GB survived 24000 while 486 GB did not, so input size does not predict
    # which side of the cliff a run lands on.
    #
    # The check that distinguishes a safe cut from a fatal one is the job's own
    # cgroup `memory.stat`: read `anon` against `file`. Anonymous memory is a
    # cliff -- exceed it and the cgroup kills you. Page cache is reclaimable and
    # is evicted under pressure instead. escpod here is ~24 GB of anon arena, so
    # it is all cliff. dorado below measures anon 5.3 GiB against 111.1 GiB of
    # page cache, which is why ITS 128 G looks equally oversized and is not.
    # Do not re-cut this without that measurement and a controlled A/B on the
    # largest flowcell.
    mem_mb: 48000
    # 16, not 32, and the "UNMEASURED" note this replaces is now measured.
    #
    # Read from the job's own cgroup (cpu.stat usage_usec) on a 530 GB flowcell
    # mid-run, 45 s of 5 s windows:
    #
    #     mean 1.86 cores, peak 4.24, of 32 allocated  -- 6% mean, 13% peak
    #
    # with several windows at 0.00 that line up with both GPUs sitting idle.
    # This rule is bound by filesystem read latency (BeeGFS here), not by CPU
    # and not by GPU, so the 32 was buying nothing. 16 is ~4x the observed peak.
    #
    # NOT cut further, and not to 8, for two reasons. The sample is one phase of
    # one flowcell. And a project config setting `ldx.threads: 32` still asks
    # escpod for 32 threads -- the mismatch the original note below calls a bug
    # becomes deliberate at that point, but a cgroup tight enough to thrash 32
    # threads on a 12h rule with no resume would trade a real flowcell for an
    # accounting tidy-up. `ldx.threads` should follow this down, but note that
    # editing it mid-campaign invalidates every completed demux: it is a params
    # change and snakemake's default rerun-triggers include params.
    #
    # Original note, kept because it explains the pairing:
    # 32 to match `ldx.threads` in the project config. The committed default was
    # 16, which silently halves what the config asks for, since the profile's
    # default-resources overrides a rule's own `threads:`.
    cpus_per_task: 16

  # The FDX (5' index) pass: the same escpod demux over the same raw POD5, with
  # a read-end-anchored bundle and no boundary CNN. Nothing measured yet, so it
  # inherits escapepod_demux's shape wholesale -- the sweep of the POD5 is the
  # same IO-bound work, and the encoder is the same size of model. Like
  # escapepod_demux it has no resume. Re-derive from the first real run.
  escapepod_demux_fdx:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    gres: "gpu:2"
    runtime: "12h"
    mem_mb: 48000
    cpus_per_task: 16

  # Joins the per-axis classifications into the run's basecall list. Holds
  # the primary axis's assigned reads in a dict (one UUID string per read),
  # so memory follows the assigned fraction of the run: ~30M reads is a few
  # GB. Same shape as extract_ldx_sample_reads below.
  ldx_run_read_ids:
    runtime: "1h"
    mem_mb: 16000
    cpus_per_task: 1

  # The LDX run basecall. Same work as `rebasecall`, gathered into one job
  # instead of one per sample, so it needs a runtime that covers the whole
  # flowcell rather than a barcode's share of it.
  #
  # THIS RULE RESUMES (#149). It runs through
  # workflow/scripts/dorado_basecall_resume.sh, which keeps the partial BAM of a
  # killed attempt out of Snakemake's reach and feeds it back as dorado's
  # --resume-from, so an overrun costs the tail of a basecall and a requeue
  # rather than the whole flowcell. That inverts the old sizing advice: this
  # number can be the measured need instead of insurance against being wrong.
  #
  # It still should not be wildly over-asked. Slurm will not START a job whose
  # walltime crosses a pending maintenance reservation, so an over-large request
  # means the job never runs -- and failing to start costs a whole scheduling
  # window, where an overrun now costs only the unfinished tail.
  #
  # dorado is not pinned to a device (`opts.dorado` passes no -x), so it uses
  # every GPU the allocation makes visible. Two measurements, and note they
  # differ in BOTH the basecalling model and the GPU count:
  #
  #   rna004_130bps_sup@v5.3.0, 4x A30, 2026-08-26:
  #     928,690 reads in 569 s = 1,632 reads/s wall
  #   rna004_sup@v6.0.0 (the v0.5.0 default), gpu:2, 2026-09-03 (job 256074):
  #     8,646,049 reads in 02:34:44 = 931 reads/s wall
  #
  # The second is the one that sets this number, because it matches what the
  # rule now asks for on both counts -- the v6 model and the `gres: gpu:2`
  # below. A 30.7M read flowcell in the E. coli IVC corpus is ~9.2 h at 931
  # reads/s, and 600m is that plus a little.
  #
  # Do not average the two, and do not read the pair as a model comparison:
  # halving the GPUs and changing the model at once confounds them, so how much
  # of the 1,632 -> 931 is v6 being slower and how much is two devices instead
  # of four is NOT separated here. The v5.3.0 row is kept only so a run pinned
  # back to that model on four GPUs has something to size against.
  rebasecall_ldx_run:
    slurm_partition: gpu
    slurm_account: gpu_rbi
    # 2, not 4, and this is a SCHEDULING decision rather than a throughput one.
    # dorado does scale across four A30s; the question is when it starts.
    #
    # Asked of the scheduler directly on 2026-09-03 with --test-only, every
    # other field held constant:
    #
    #   gpu:1  start 2026-09-03T15:08 compgpu03
    #   gpu:2  start 2026-09-03T15:08 compgpu03
    #   gpu:3  start 2026-09-03T15:08 compgpu03
    #   gpu:4  start 2026-09-04T03:45 compgpu01   <- 12.5 h later
    #
    # cpus_per_task made no difference (16 and 32 gave the same answer). The
    # whole cost was the fourth GPU: a gpu:4 request needs a node with nothing
    # else on it, so one unrelated single-GPU job holds a whole node back from
    # satisfying it.
    #
    # Re-derive per site rather than inheriting this. On an idle gpu partition 4
    # is strictly faster and costs nothing; on a contended one it is the
    # difference between this afternoon and tomorrow morning.
    gres: "gpu:2"
    runtime: "600m"   # 10h -- see note above
    # 128 GB, and this number is a BUDGET, not a requirement -- dorado expands
    # to whatever the cgroup allows. Two runs of this rule over the identical
    # 4,889,538 reads, same node, same GPUs:
    #
    #   request 125.0 GiB -> peak 124.9 GiB, elapsed 01:02:39
    #   request 187.5 GiB -> peak 187.4 GiB, elapsed 01:02:38
    #
    # The peak tracks the LIMIT at 99.9%, twice, and the extra 62.5 GiB bought
    # one second. So a run "finishing with 130 MB to spare" is not a near miss
    # and is not evidence the ceiling is too low; it is what adaptive sizing
    # looks like from the outside. Raising this on that reading -- which is
    # what took it to 192000 -- cost 62 GiB of a 251 GB node for nothing and
    # made the job harder to co-schedule.
    #
    # 125 GiB is the smallest figure PROVEN here, so that is what it is set to.
    # Lower is likely fine and is worth measuring; if you test it, watch the
    # elapsed time rather than MaxRSS, because MaxRSS will simply follow
    # whatever you set. Note the single-POD5 `dorado basecaller` benchmark
    # (~16 GiB, no --read-ids, one file) is not comparable to this rule either.
    mem_mb: 128000
    # 12, down from 32, measured from the job cgroup (cpu.stat) mid-basecall,
    # 40 s of 5 s windows:
    #
    #     mean 4.67 cores, peak 4.84, of 32 allocated  -- 15%
    #
    # and unlike escapepod_demux the draw is FLAT (4.58-4.84), not spiky, so the
    # mean is the whole story. 12 leaves ~2.5x on the peak. dorado is genuinely
    # GPU-bound here -- every A30 on the node sits at 100% util with two of
    # these jobs on it -- so CPU is not what paces it and the 32 bought nothing.
    #
    # This cannot be applied to an already-queued job. `scontrol update
    # NumCPUs=` and `CpusPerTask=` both return success on a PENDING job and
    # change nothing (verified: NumCPUs=32 before and after). Only a new
    # submission picks it up. `TimeLimit=` and `MinMemoryNode=` do take.
    cpus_per_task: 12

  ldx_split_parent_map:
    runtime: "2h"
    mem_mb: 8000
    cpus_per_task: 4

  extract_ldx_sample_reads:
    runtime: "1h"
    mem_mb: 16000
    cpus_per_task: 1

  split_ldx_ubam:
    runtime: "4h"
    mem_mb: 8000
    cpus_per_task: 4

  compute_odds_ratios:
    mem_mb: 16000
