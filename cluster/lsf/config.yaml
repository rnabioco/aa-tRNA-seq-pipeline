executor: lsf
jobs: 100

# N.B. GB values should be passed to mem_mb
default-resources:
  - 'mem_mb=8'
  - 'lsf_queue=rna'
  - 'lsf_project=aatrnaseq'
  - 'lsf_extra=""'

resources:
  - ngpu=8
  # Concurrent POD5-sweeping jobs; see the slurm profile for the measurement
  # this is sized from, and rule classify_charging for why the cap and not the
  # core count is the lever.
  - pod5_readers=8

# set rule specific requirements
set-resources:
  - rebasecall:lsf_queue="gpu"
  - rebasecall:lsf_extra="-gpu num=1:j_exclusive=yes:mode=exclusive_process"
  - rebasecall:ngpu=1
  - rebasecall:mem_mb=24
  # mem_mb only -- lsf_queue/lsf_extra/ngpu are NOT set here. `charging.gpu`
  # (config/config-base.yml) toggles this rule between the CPU (default) and
  # GPU windowed-TCN scorer, and this static profile has no way to see that
  # pipeline-config value, so the rule declares those three itself
  # (aatrnaseq-process.smk) and they win over anything unset here.
  #
  # 40 GB: MaxRSS on the 2026-09-04 results_v05 jobs was 23.31 G against a
  # 24 GB request, and it scales with read count. Unmeasured for the GPU
  # path -- a safe ceiling, not a GPU-specific budget; revisit once profiled.
  - classify_charging:mem_mb=40
  - bwa_align:mem_mb=24
  - modkit_extract_calls:mem_mb=96
  - modkit_extract_full:mem_mb=48
  # LDX demux runs the CRF encoder and boundary CNN on the GPU (ldx.gpu),
  # so it needs one; the lattice decode stays on the CPU, hence the cores too.
  - escapepod_demux:lsf_queue="gpu"
  - escapepod_demux:lsf_extra="-gpu num=1:j_exclusive=yes:mode=exclusive_process"
  - escapepod_demux:ngpu=1
  - escapepod_demux:mem_mb=48
  # The FDX (5' index) pass: same sweep of the raw POD5 with a second CRF
  # bundle, so the same shape until measured.
  - escapepod_demux_fdx:lsf_queue="gpu"
  - escapepod_demux_fdx:lsf_extra="-gpu num=1:j_exclusive=yes:mode=exclusive_process"
  - escapepod_demux_fdx:ngpu=1
  - escapepod_demux_fdx:mem_mb=48
  - ldx_run_read_ids:mem_mb=16
  - warpdemux:mem_mb=32
  - parse_warpdemux:mem_mb=8

printshellcmds: True
show-failed-logs: True
latency-wait: 60
