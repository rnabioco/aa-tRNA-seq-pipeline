executor: cluster-generic
cluster-generic-submit-cmd:
  bsub
    -o "{log}.out"
    -e "{log}.err"
    -J "{rule}-{wildcards}"
    -R "select[mem>{resources.mem_mb}] rusage[mem={resources.mem_mb}] span[hosts=1]"
    -n {threads}
    -q "{resources.queue}"
    "{resources.gpu_opts}"

# note that GB values should be passed to mem_mb
default-resources:
  - mem_mb=8
  - queue="rna"
  - gpu_opts=""

jobs: 100

# amc-bodhi has 8 GPUs
# this setting controls the number of concurrent GPU jobs run by snakemake
resources:
  - ngpu=8

# set rule specific requirements
set-resources:
  - rebasecall:queue="gpu"
  - rebasecall:gpu_opts="-gpu num=1:j_exclusive=yes:mode=exclusive_process"
  - rebasecall:ngpu=1
  - rebasecall:mem_mb=24
  - classify_charging:mem_mb=24
  - inject_ubam_tags:mem_mb=16
  - bwa_align:mem_mb=24
  - modkit_extract_calls:mem_mb=96
  - modkit_extract_full:mem_mb=48
  - warpdemux:mem_mb=32
  - parse_warpdemux:mem_mb=8
  # escapepod CRF demux. CPU-bound: the released escpod has no CUDA provider,
  # so the encoder runs on cores (~59 ms of CPU per read). Memory scales with
  # the barcode count, not the input size.
  - escapepod_demux:mem_mb=48
  - link_demux_pod5:mem_mb=2


printshellcmds: True
show-failed-logs: True
latency-wait: 60
cluster-generic-cancel-cmd: "bkill"
