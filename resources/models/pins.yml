# Pins deliberately held BEHIND the newest upstream release: vendored model
# bundles (one entry per family, at the top level) and the tool versions
# config-base.yml pins (under `tools:`).
#
# Read by `pixi run check-currency` (scripts/check-currency.py; weekly in CI as
# .github/workflows/currency.yml), which otherwise reports every pin upstream
# has superseded. An entry here is a recorded decision, not a suppression: it
# must name the version actually pinned, so a later bump that leaves this file
# untouched is reported as a stale hold rather than silently inheriting the old
# justification.
#
# A pin that is simply current needs no entry.

tools:
  dorado:
    version: 2.1.1
    reason: >
      The charging bundle declares the basecaller it was trained against --
      charging_feature_nn_sup6_rna004@v0.1.0 names dorado 2.1.1+d66c17c and
      rna004_sup@v6.0.0 -- and its dominant feature is the k-mer residual
      against the read's own basecall, so a basecaller change is a domain shift
      on that feature (measured upstream at ~0.0097 AUROC and 3.9% of per-read
      calls flipped, with the aggregate charged fraction moving only 0.04 pp).
      `pixi run verify-basecaller` proves the installed binary is the declared
      one byte-for-byte. dorado moves when a charging bundle trained on the new
      release does, not before; upstream is at 2.1.2 (2026-08-26).

barcode_crf_ldx16_rna004:
  version: 0.1.0
  reason: >
    v0.1.1 is an unexplained rebuild, not an improvement. Same corpus
    (n_train 283,296 in both), same geometry, same ldx01..ldx16 names; the only
    structural difference is that the training config came from leech's packaged
    crf_ctc.toml rather than this project's scripts/ldx/crf_config.toml. It
    lands 0.0038 LOWER on exact match than the v0.1.0 we vendor (0.97965 against
    0.98342), and upstream is itself still bounding that gap as training-seed
    variance — escapepod-models 2cb4324 added a seed axis for exactly this
    reason, noting the task has no measured run-to-run spread to compare it
    against. v0.1.1 deliberately did not become the shipped bundle upstream
    either. Moving would mean vendoring a new bundle to get a model that scores
    lower, so we stay until the seed sweep gives an error bar that explains it.
